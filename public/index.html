<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Direct Integrations · CloudEagle</title>
<meta name="description" content="Prototype: request a missing SaaS integration, generate it with AI from API docs, test it, and go live with approval.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* CloudEagle-style admin shell: navy sidebar, light workspace, white cards. Matches the Figma frames. */
:root{
  --navy:#0F1B3D; --side-text:#C9D1E8; --side-muted:#7F8BB0;
  --primary:#3B5BDB; --primary-dark:#2A45B0; --primary-soft:#E3EBFF;
  --bg:#F5F6FA; --card:#FFFFFF; --line:#E4E7EE; --line-2:#EEF0F4;
  --ink:#1B2437; --ink-2:#4A5468; --muted:#6B7488; --faint:#8A93A6;
  --green:#177A44; --green-bg:#E6F6EC; --amber:#9A6200; --amber-bg:#FFF4DB;
  --red:#B00020; --red-bg:#FDECEE; --purple:#5B34B8; --purple-bg:#F0E8FF;
  --code:#0F1730; --code-ink:#D6DEF5; --teal:#0E8F8A;
  --f-ui:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-ui)}
button{font:inherit;font-size:13px;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
input,textarea,select{font:inherit;font-size:13px;color:var(--ink)}
a{color:var(--primary)}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
.side{background:var(--navy);color:var(--side-text);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{font-weight:800;color:#fff;font-size:18px;padding:0 8px 16px;letter-spacing:-.01em}
.nav{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;color:var(--side-text);font-size:13px}
.nav .box{width:14px;height:14px;border:1.5px solid var(--side-muted);border-radius:4px;flex:none}
.nav.head{font-weight:700;color:#fff}
.nav.sub{padding-left:30px;font-size:12.5px}
.nav.sub2{padding-left:42px;font-size:12.5px}
.nav.active{background:rgba(255,255,255,.12);color:#fff;font-weight:700}
.nav .count{margin-left:auto;background:var(--primary);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700}
.side .foot{margin-top:auto;font-size:11px;color:var(--side-muted);padding:8px}
.main{display:flex;flex-direction:column;min-width:0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;background:var(--card);border-bottom:1px solid var(--line);padding:10px 28px}
.top .search{flex:0 1 320px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--faint);font-size:12.5px}
.top .sp{flex:1}
.iconbtn{position:relative;width:34px;height:34px;border-radius:50%;background:var(--bg);display:grid;place-items:center;border:1px solid var(--line)}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:999px;background:#E5484D;color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid var(--card)}
.acct{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 12px 3px 3px;position:relative}
.acct .who{display:flex;flex-direction:column;line-height:1.15;text-align:left}
.acct .who b{font-size:12.5px}
.acct .who span{font-size:11px;color:var(--muted)}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;background:var(--primary);flex:none}
.avatar.rm{background:var(--teal)}
.pulse{position:absolute;top:-2px;left:22px;width:11px;height:11px;border-radius:50%;background:#E5484D;border:2px solid var(--card)}
.pulse::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid #E5484D;animation:ring 1.6s var(--ease) infinite}
@keyframes ring{from{transform:scale(.6);opacity:1}to{transform:scale(1.6);opacity:0}}
.drop{position:absolute;right:0;top:calc(100% + 8px);width:340px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px rgba(15,27,61,.18);padding:8px;z-index:30;animation:pop .16s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.drop .hd{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 8px}
.drop .item{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:8px;border-radius:8px}
.drop .item:hover{background:var(--bg)}
.drop .item .t{flex:1;min-width:0}
.drop .item .t b{display:block;font-size:13px}
.drop .item .t span{font-size:12px;color:var(--muted)}
.drop .sep{height:1px;background:var(--line);margin:6px 0}
.dot-new{width:8px;height:8px;border-radius:50%;background:var(--primary);flex:none}
.content{padding:22px 28px 48px;display:flex;flex-direction:column;gap:16px;max-width:1240px;width:100%;min-width:0}
.content.enter>*{animation:rise .32s var(--ease) both}
.content.enter>*:nth-child(2){animation-delay:.03s}.content.enter>*:nth-child(3){animation-delay:.06s}.content.enter>*:nth-child(4){animation-delay:.09s}.content.enter>*:nth-child(n+5){animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.reveal{animation:rise .35s var(--ease) both}
.crumb{font-size:12px;color:var(--muted)}
.crumb b{color:var(--ink)}
h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:16px;margin:0;font-weight:800}
h3{font-size:14px;margin:0;font-weight:700}
.lede{color:var(--muted);margin:2px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;font-weight:700;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:#C9CEDA}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-dark)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--primary)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.blue{background:var(--primary-soft);color:var(--primary-dark)}.pill.amber{background:var(--amber-bg);color:var(--amber)}.pill.green{background:var(--green-bg);color:var(--green)}.pill.grey{background:var(--line-2);color:var(--ink-2)}.pill.purple{background:var(--purple-bg);color:var(--purple)}.pill.red{background:var(--red-bg);color:var(--red)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lab{font-size:12px;font-weight:700;color:var(--ink-2)}
.hint{font-weight:400;color:var(--faint)}
.input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card);width:100%}
select.input{appearance:auto}
textarea.input{min-height:130px;resize:vertical;font-family:var(--f-mono);font-size:12px}
.seg{display:inline-flex;background:var(--line-2);border-radius:8px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:6px;color:var(--ink-2);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(15,27,61,.15)}
.searchbox{display:flex;align-items:center;gap:8px;border:1.5px solid var(--primary);border-radius:8px;padding:9px 12px;background:var(--card);max-width:440px}
.searchbox input{border:0;outline:0;flex:1;min-width:0;font-size:14px;background:transparent}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:22px}
.empty .ic{width:40px;height:40px;border-radius:50%;background:var(--line-2);display:grid;place-items:center;color:var(--muted);font-size:18px}
.list{display:flex;flex-direction:column;gap:8px}
.app-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;position:relative}
.app-row.hl{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.logo{width:30px;height:30px;border-radius:8px;background:var(--primary-soft);display:grid;place-items:center;font-weight:800;color:var(--primary-dark);flex:none}
.app-row .nm{font-weight:700;flex:1;min-width:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}.faint{color:var(--faint)}.ok{color:var(--green);font-weight:600}.small{font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line);background:#FAFBFD}
td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
/* nudges */
.nudge{display:flex;gap:12px;align-items:center;border-radius:12px;padding:12px 14px;border:1px solid}
.nudge .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none}
.nudge .tx{flex:1;min-width:0}
.nudge .tx b{display:block}
.nudge.info{background:#F3F6FF;border-color:#D4DEFF}.nudge.info .ic{background:var(--primary);color:#fff}
.nudge.warn{background:var(--amber-bg);border-color:#F1DDAA}.nudge.warn .ic{background:#E8A317;color:#fff}
.nudge.good{background:var(--green-bg);border-color:#BFE6CC}.nudge.good .ic{background:var(--green);color:#fff}
.nudge.bad{background:var(--red-bg);border-color:#F4C7CD}.nudge.bad .ic{background:var(--red);color:#fff}
/* stepper */
.stepper{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.step{display:flex;align-items:center;gap:9px;border:0;background:none;padding:2px;text-align:left;border-radius:8px}
.step .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;background:var(--line-2);color:var(--muted);transition:background .3s,color .3s}
.step.cur .dot{background:var(--primary);color:#fff;box-shadow:0 0 0 4px var(--primary-soft)}
.step.done .dot{background:var(--green);color:#fff}
.step .lbl{display:flex;flex-direction:column;line-height:1.2}
.step .lbl b{font-size:13px}
.step .lbl span{font-size:11px;color:var(--muted)}
.step.done .lbl b{color:var(--green)}
.step.locked{opacity:.6}
.track{flex:0 1 60px;height:3px;border-radius:3px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;background:var(--green);width:0;transition:width .5s var(--ease)}
.track.full i{width:100%}
.stepper .sp{flex:1}
/* progress checklist */
.prog{display:flex;flex-direction:column;gap:8px}
.pi{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--faint);transition:color .2s}
.pi .m{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.pi.run{color:var(--ink)}.pi.run .m{border-color:var(--primary);border-top-color:transparent;animation:sp .8s linear infinite}
.pi.ok{color:var(--ink-2)}.pi.ok .m{border-color:var(--green);background:var(--green);color:#fff}
@keyframes sp{to{transform:rotate(360deg)}}
.bar{height:4px;border-radius:4px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#7C9BFF);transition:width .4s var(--ease)}
/* understanding */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ucard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0;transition:border-color .2s,box-shadow .2s}
.ucard.editing{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.ucard .hd{display:flex;justify-content:space-between;gap:8px;align-items:center}
.ucard .acts{display:flex;gap:10px;font-size:12px}
.linkbtn{border:0;background:none;color:var(--primary);font-weight:600;padding:0;font-size:12px}
.mono{font-family:var(--f-mono);font-size:12px;line-height:1.6;overflow-wrap:anywhere}
.chip-warn{background:var(--amber-bg);color:var(--amber);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700}
.chip-info{background:var(--primary-soft);color:var(--primary-dark);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600}
.dashed{border:1.5px dashed var(--line);border-radius:12px;padding:12px 14px;background:var(--bg)}
/* code */
.codewrap{display:grid;grid-template-columns:200px minmax(0,1fr) 260px;gap:12px;align-items:start}
.tree{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.tree .t{font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:4px 6px}
.tree button{border:0;background:none;text-align:left;font-family:var(--f-mono);font-size:12px;padding:5px 6px;border-radius:6px;color:var(--ink-2)}
.tree button[aria-current="true"]{background:var(--primary-soft);color:var(--ink);font-weight:700}
.editor{background:var(--code);border-radius:12px;overflow:hidden;min-width:0;display:flex;flex-direction:column}
.tabs{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid rgba(255,255,255,.08);padding:0 8px}
.tabs button{border:0;background:none;color:#9AA6C8;padding:10px;font-weight:600;font-size:12px;border-bottom:2px solid transparent}
.tabs button[aria-current="true"]{color:#fff;border-bottom-color:#7C9BFF}
.fname{color:#7F8BB0;font-family:var(--f-mono);font-size:11px;padding:10px 14px 0;display:flex;justify-content:space-between}
pre.code{margin:0;padding:10px 14px 16px;color:var(--code-ink);font-family:var(--f-mono);font-size:12px;line-height:1.6;overflow:auto;max-height:480px;white-space:pre}
.checks{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:12.5px}
.chk .m{width:18px;height:18px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:800}
.chk .m.pass{background:var(--green-bg);color:var(--green)}.chk .m.fail{background:var(--red-bg);color:var(--red)}.chk .m.warn{background:var(--amber-bg);color:var(--amber)}
.chk .d{display:block;color:var(--red);font-size:11px}
.chk .n{display:block;color:var(--muted);font-size:11.5px}
/* request log */
.pm{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.pm .reqs{border-right:1px solid var(--line);display:flex;flex-direction:column;max-height:340px;overflow:auto}
.pm .reqs .t{font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:10px 12px;position:sticky;top:0;background:var(--card)}
.req{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:8px;align-items:center;border:0;border-top:1px solid var(--line-2);background:none;text-align:left;padding:8px 12px;font-family:var(--f-mono);font-size:11.5px;animation:rise .25s var(--ease) both}
.req .mth{color:var(--green);font-weight:700}
.req .p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.req.s429,.req.s403{background:var(--amber-bg)}
.req[aria-current="true"]{outline:2px solid var(--primary);outline-offset:-2px}
.st{font-weight:700}.st.g{color:var(--green)}.st.a{color:var(--amber)}
.pm .detail{padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pm .lab{font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:700}
.kv{background:var(--bg);border-radius:8px;padding:8px 10px;font-family:var(--f-mono);font-size:11.5px;overflow-wrap:anywhere;white-space:pre-wrap}
.body{background:var(--code);color:var(--code-ink);border-radius:8px;padding:10px;font-family:var(--f-mono);font-size:11.5px;white-space:pre;overflow:auto;max-height:190px}
details>summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--primary);list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";}
details[open]>summary::before{content:"▾ ";}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tile.save{background:var(--green-bg);border-color:#BFE6CC}.tile.save .k,.tile.save .v{color:var(--green)}
.tile.inact .v{color:var(--amber)}
.apptabs{display:flex;gap:20px;border-bottom:1px solid var(--line)}
.apptabs span{padding:8px 0;color:var(--ink-2);font-weight:600}
.apptabs span.on{color:var(--primary);border-bottom:2px solid var(--primary)}
.report{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.report .rh{background:#FAFBFD;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.report .rb{padding:16px;display:flex;flex-direction:column;gap:14px}
.signoff{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:10px;padding:10px 12px}
/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(15,27,61,.55);display:grid;place-items:center;padding:16px;z-index:40;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border-radius:14px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 60px rgba(0,0,0,.28);animation:pop .2s var(--ease)}
.radio{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;transition:border-color .15s,background .15s}
.radio.on{border-color:var(--primary);background:#F7F9FF}
.radio label{display:flex;gap:8px;align-items:center;font-weight:700;cursor:pointer}
.radio .desc{font-size:12px;color:var(--muted);margin-left:24px}
.checks-row{display:flex;flex-wrap:wrap;gap:14px}
.checks-row label{display:flex;gap:6px;align-items:center}
.lockchip{display:inline-flex;gap:6px;align-items:center;background:var(--line-2);border-radius:999px;padding:4px 10px;font-weight:700;font-size:12px}
.oauth{display:flex;flex-direction:column;gap:12px}
.oauth .brandline{display:flex;align-items:center;gap:10px}
.oauth .scope{display:flex;gap:8px;align-items:center;font-size:13px}
.toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:min(440px,calc(100vw - 40px))}
.toast{background:var(--navy);color:#fff;border-radius:10px;padding:11px 14px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.25);display:flex;gap:12px;align-items:center;animation:slidein .25s var(--ease)}
.toast button{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:6px;padding:5px 10px;font-weight:700;white-space:nowrap}
@keyframes slidein{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.choice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ch{border:1.5px solid var(--line);border-radius:12px;padding:16px;background:var(--card);text-align:left;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,box-shadow .15s,transform .15s}
.ch:hover:not(:disabled){border-color:var(--primary);box-shadow:0 6px 18px rgba(59,91,219,.12);transform:translateY(-1px)}
.ch.rec{border-color:var(--primary)}
.ch:disabled{opacity:.6;cursor:not-allowed}
.menuwrap{position:relative}
.menuwrap .pop{position:absolute;right:0;top:36px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 24px rgba(15,27,61,.15);display:flex;flex-direction:column;min-width:180px;z-index:15;padding:4px;animation:pop .14s var(--ease)}
.menuwrap .pop button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:6px}
.menuwrap .pop button:hover{background:var(--bg)}
.success{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:26px}
.success .big{width:56px;height:56px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:800;animation:pop .35s var(--ease)}
button.nav{border:0;background:none;text-align:left;width:100%;cursor:pointer}
button.nav:hover{background:rgba(255,255,255,.08)}
.nav.dim{opacity:.45;cursor:default}
.side .spacer{flex:1}
.resetbtn{color:#fff;border:1px solid rgba(255,255,255,.18)!important;justify-content:center;font-weight:700}
.crumblink{border:0;background:none;padding:0;color:var(--primary);font-size:12px;font-weight:600}
.crumblink:hover{text-decoration:underline}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.appcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;transition:border-color .15s,box-shadow .15s,transform .15s}
.appcard:hover{border-color:var(--primary);box-shadow:0 8px 22px rgba(59,91,219,.12);transform:translateY(-2px)}
.appcard.hl{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.appcard p{margin:0;color:var(--ink-2)}
.appcard.add{border-style:dashed;align-items:center;justify-content:center;text-align:center;color:var(--primary);min-height:190px}
.apptabs button{border:0;background:none;padding:10px 0;color:var(--ink-2);font-weight:600;border-bottom:2px solid transparent}
.apptabs button.on{color:var(--primary);border-bottom-color:var(--primary)}
.tabbody{display:flex;flex-direction:column;gap:16px;animation:rise .25s var(--ease) both}
.howit{background:#F3F6FF;border:1px solid #D4DEFF;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.howit ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.ch.on{border-color:var(--primary);background:#F7F9FF}
.reqbox>summary{font-size:14px;color:var(--ink)}
.card.danger{border-color:#F4C7CD}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:1180px){.codewrap{grid-template-columns:minmax(0,1fr)}.tree{flex-direction:row;flex-wrap:wrap}}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr)}.side{display:none}.grid2,.grid3,.choice{grid-template-columns:minmax(0,1fr)}.pm{grid-template-columns:minmax(0,1fr)}.pm .reqs{border-right:0;border-bottom:1px solid var(--line)}.content{padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}.top{padding:10px 16px}.acct .who{display:none}.drop{width:min(340px,calc(100vw - 32px))}}
</style>

y.com/users/USER_0121", "https://api.calendly.com/users/USER_0122", "https://api.calendly.com/users/USER_0123", "https://api.calendly.com/users/USER_0124", "https://api.calendly.com/users/USER_0125", "https://api.calendly.com/users/USER_0126", "https://api.calendly.com/users/USER_0127", "https://api.calendly.com/users/USER_0128", "https://api.calendly.com/users/USER_0129", "https://api.calendly.com/users/USER_0130", "https://api.calendly.com/users/USER_0131", "https://api.calendly.com/users/USER_0132", "https://api.calendly.com/users/USER_0133", "https://api.calendly.com/users/USER_0134", "https://api.calendly.com/users/USER_0135", "https://api.calendly.com/users/USER_0136", "https://api.calendly.com/users/USER_0137", "https://api.calendly.com/users/USER_0138", "https://api.calendly.com/users/USER_0139", "https://api.calendly.com/users/USER_0140", "https://api.calendly.com/users/USER_0141", "https://api.calendly.com/users/USER_0142", "https://api.calendly.com/users/USER_0143", "https://api.calendly.com/users/USER_0144", "https://api.calendly.com/users/USER_0145", "https://api.calendly.com/users/USER_0146", "https://api.calendly.com/users/USER_0147", "https://api.calendly.com/users/USER_0148", "https://api.calendly.com/users/USER_0149", "https://api.calendly.com/users/USER_0150"]};
const FILES = {"client.py": "\"\"\"API client: the single gateway to Calendly.\n\nSafeguards are built in here, so no other file can bypass them:\n- Read-only: only GET exists. There is no method to create, change or delete.\n- Host allow-list: requests can only go to the configured Calendly host.\n- Rate limits: reads X-RateLimit-Remaining / X-RateLimit-Reset, pauses before\n  running out, and on 429 waits for the reset before retrying.\n- Retries with backoff for 429 and 5xx; immediate, clear errors for 400/401/403/404.\n\"\"\"\nimport time\nfrom urllib.parse import urlparse\n\nimport requests\n\nfrom .errors import AuthenticationError, error_from_response\n\n\nclass CalendlyClient:\n    def __init__(self, base_url, auth, logger, allowed_hosts,\n                 timeout=30, max_retries=4, sleep=time.sleep):\n        self.base_url = base_url.rstrip(\"/\")\n        self.auth = auth\n        self.log = logger\n        self.allowed_hosts = set(allowed_hosts)\n        self.timeout = timeout\n        self.max_retries = max_retries\n        self.sleep = sleep\n        self.session = requests.Session()\n        self.session.headers.update({\"Accept\": \"application/json\"})\n        self._check_host(self.base_url)\n\n    def _check_host(self, url):\n        host = urlparse(url).hostname\n        if host not in self.allowed_hosts:\n            raise ValueError(f\"Blocked request to non-allowed host: {host}\")\n\n    def get(self, path_or_url, params=None):\n        url = path_or_url if path_or_url.startswith(\"http\") else f\"{self.base_url}{path_or_url}\"\n        self._check_host(url)\n        path = urlparse(url).path\n        refreshed = False\n\n        for attempt in range(1, self.max_retries + 2):\n            response = self.session.get(url, params=params, headers=self.auth.header(),\n                                        timeout=self.timeout)\n            remaining = response.headers.get(\"X-RateLimit-Remaining\")\n            reset = response.headers.get(\"X-RateLimit-Reset\")\n            self.log.info(\"request\", extra={\"method\": \"GET\", \"path\": path,\n                                            \"status\": response.status_code, \"attempt\": attempt,\n                                            \"rate_limit_remaining\": remaining})\n\n            if response.ok:\n                # Slow down before hitting the limit, not after.\n                if remaining is not None and int(remaining) <= 1 and reset:\n                    wait = float(reset)\n                    self.log.info(\"rate limit nearly used, pausing\",\n                                  extra={\"wait_seconds\": wait})\n                    self.sleep(wait)\n                return response.json()\n\n            if response.status_code == 401 and not refreshed and self.auth.refresh():\n                refreshed = True\n                continue\n\n            error = error_from_response(response, path)\n            if error.retryable and attempt <= self.max_retries:\n                if response.status_code == 429 and reset:\n                    wait = float(reset)\n                else:\n                    wait = min(2 ** (attempt - 1), 30)  # 1, 2, 4, 8 ... capped at 30s\n                self.log.warning(\"retrying\", extra={\"path\": path, \"status\": response.status_code,\n                                                    \"attempt\": attempt, \"wait_seconds\": wait})\n                self.sleep(wait)\n                continue\n\n            self.log.error(\"request failed\", extra={\"path\": path, \"status\": response.status_code})\n            if isinstance(error, AuthenticationError):\n                error.args = (str(error) + \" Reconnect Calendly: the token is invalid or revoked.\",)\n            raise error\n\n        raise error  # pragma: no cover\n", "auth.py": "\"\"\"Auth setup: Calendly supports two methods, both sent as a Bearer token.\n\n1. Personal Access Token (PAT): created by an admin in Calendly under\n   Integrations > API & Webhooks. Simple, but it never expires and stops\n   working if that person's role changes.\n2. OAuth 2.0: recommended for organizations. Short-lived access token plus a\n   refresh token.\n\nThe token is read from the environment or a secrets vault at run time. It is\nnever written in code, config files or logs.\n\"\"\"\nimport os\nimport time\n\nimport requests\n\nOAUTH_TOKEN_URL = \"https://auth.calendly.com/oauth/token\"\n\n\nclass PersonalAccessTokenAuth:\n    def __init__(self, env_var=\"CALENDLY_TOKEN\"):\n        self.env_var = env_var\n\n    def header(self):\n        token = os.environ.get(self.env_var)\n        if not token:\n            raise RuntimeError(\n                f\"No Calendly token found. Set {self.env_var} from your secrets vault.\"\n            )\n        return {\"Authorization\": f\"Bearer {token}\"}\n\n    def refresh(self):\n        return False  # a PAT cannot be refreshed; a 401 means it was revoked\n\n\nclass OAuthAuth:\n    \"\"\"Holds an OAuth access token and refreshes it before it expires.\"\"\"\n\n    def __init__(self, client_id_env=\"CALENDLY_CLIENT_ID\",\n                 client_secret_env=\"CALENDLY_CLIENT_SECRET\",\n                 refresh_token_env=\"CALENDLY_REFRESH_TOKEN\"):\n        self.client_id = os.environ.get(client_id_env)\n        self.client_secret = os.environ.get(client_secret_env)\n        self.refresh_token = os.environ.get(refresh_token_env)\n        self.access_token = None\n        self.expires_at = 0\n\n    def header(self):\n        if not self.access_token or time.time() > self.expires_at - 60:\n            self.refresh()\n        return {\"Authorization\": f\"Bearer {self.access_token}\"}\n\n    def refresh(self):\n        response = requests.post(OAUTH_TOKEN_URL, data={\n            \"grant_type\": \"refresh_token\",\n            \"refresh_token\": self.refresh_token,\n            \"client_id\": self.client_id,\n            \"client_secret\": self.client_secret,\n        }, timeout=30)\n        response.raise_for_status()\n        data = response.json()\n        self.access_token = data[\"access_token\"]\n        self.refresh_token = data.get(\"refresh_token\", self.refresh_token)\n        self.expires_at = time.time() + int(data.get(\"expires_in\", 7200))\n        return True\n\n\ndef build_auth(method):\n    if method == \"oauth\":\n        return OAuthAuth()\n    return PersonalAccessTokenAuth()\n", "users.py": "\"\"\"Retrieve users. Calendly has no single \"list all users\" call, so it takes 2 steps:\n\n1. GET /users/me -> the token owner's `current_organization` URI\n2. GET /organization_memberships?organization={uri} -> every member of that organization\n\nStep 2 needs an Owner or Admin token; otherwise Calendly returns 403.\n\"\"\"\nfrom .errors import PermissionDeniedError\nfrom .pagination import fetch_all\n\n\ndef get_organization_uri(client):\n    me = client.get(\"/users/me\")[\"resource\"]\n    return me[\"current_organization\"]\n\n\ndef list_members(client, organization_uri, logger, max_pages=None):\n    try:\n        return list(fetch_all(client, \"/organization_memberships\",\n                              {\"organization\": organization_uri}, logger, max_pages))\n    except PermissionDeniedError as error:\n        raise PermissionDeniedError(\n            403, \"Listing all users needs a Calendly Owner or Admin token.\", error.path\n        ) from error\n", "usage.py": "\"\"\"Retrieve usage. Calendly exposes two usage signals:\n\n1. Meetings booked per user (all plans): GET /scheduled_events for the\n   organization in the last N days, counted per host via `event_memberships`.\n2. Last activity per user (Enterprise plan only): GET /activity_log_entries.\n   On non-Enterprise plans Calendly returns 403; we record that the signal is\n   unavailable instead of failing the whole sync.\n\"\"\"\nfrom collections import Counter\nfrom datetime import datetime, timedelta, timezone\n\nfrom .errors import PermissionDeniedError\nfrom .pagination import fetch_all\n\n\ndef _iso(dt):\n    return dt.strftime(\"%Y-%m-%dT%H:%M:%S.000000Z\")\n\n\ndef meetings_per_user(client, organization_uri, logger, days=90, max_pages=None):\n    now = datetime.now(timezone.utc)\n    params = {\n        \"organization\": organization_uri,\n        \"min_start_time\": _iso(now - timedelta(days=days)),\n        \"max_start_time\": _iso(now),\n        \"status\": \"active\",\n    }\n    counts = Counter()\n    for event in fetch_all(client, \"/scheduled_events\", params, logger, max_pages):\n        for host in event.get(\"event_memberships\", []):\n            counts[host[\"user\"]] += 1\n    return counts\n\n\ndef last_activity_per_user(client, organization_uri, logger, days=90, max_pages=None):\n    \"\"\"Returns ({user_uri: latest occurred_at}, available: bool).\"\"\"\n    since = datetime.now(timezone.utc) - timedelta(days=days)\n    params = {\"organization\": organization_uri, \"min_occurred_at\": _iso(since)}\n    latest = {}\n    try:\n        for entry in fetch_all(client, \"/activity_log_entries\", params, logger, max_pages):\n            actor = (entry.get(\"actor\") or {}).get(\"uri\")\n            when = entry.get(\"occurred_at\")\n            if actor and when and (actor not in latest or when > latest[actor]):\n                latest[actor] = when  # ISO-8601 UTC strings compare correctly\n    except PermissionDeniedError:\n        logger.info(\"activity log unavailable (Calendly Enterprise plan only)\")\n        return {}, False\n    return latest, True\n", "pagination.py": "\"\"\"Pagination: Calendly uses cursor-based paging.\n\nEach list response has a `collection` and a `pagination` object. We request\nthe maximum page size (count=100) and keep passing `pagination.next_page_token`\nas `page_token` until it is null. `max_pages` lets a limited production run\nfetch only the first page.\n\"\"\"\n\nPAGE_SIZE = 100\n\n\ndef fetch_all(client, path, params, logger, max_pages=None):\n    params = {**params, \"count\": PAGE_SIZE}\n    page = 0\n    while True:\n        page += 1\n        data = client.get(path, params=params)\n        records = data.get(\"collection\", [])\n        logger.info(\"page fetched\", extra={\"path\": path, \"page\": page, \"records\": len(records)})\n        yield from records\n\n        token = (data.get(\"pagination\") or {}).get(\"next_page_token\")\n        if not token or (max_pages and page >= max_pages):\n            break\n        params = {**params, \"page_token\": token}\n", "errors.py": "\"\"\"Error handling: one exception type per failure the Calendly API documents.\n\nCalendly returns JSON error bodies (typically with \"title\" and \"message\"), but\nwe parse them defensively because AI-generated code must never crash on an\nunexpected error shape.\n\"\"\"\n\n\nclass CalendlyError(Exception):\n    \"\"\"Base class. `retryable` tells the client whether trying again can help.\"\"\"\n\n    retryable = False\n\n    def __init__(self, status, message, path=None):\n        self.status = status\n        self.path = path\n        super().__init__(f\"[{status}] {message} ({path})\")\n\n\nclass InvalidRequestError(CalendlyError):      # 400: bad parameter, a bug in our request\n    pass\n\n\nclass AuthenticationError(CalendlyError):      # 401: token missing, expired or revoked\n    pass\n\n\nclass PermissionDeniedError(CalendlyError):    # 403: not an admin/owner, or feature not on this plan\n    pass\n\n\nclass NotFoundError(CalendlyError):            # 404: organization or user URI does not exist\n    pass\n\n\nclass RateLimitError(CalendlyError):           # 429: still limited after all retries\n    retryable = True\n\n\nclass ServerError(CalendlyError):              # 5xx: Calendly-side problem\n    retryable = True\n\n\nSTATUS_TO_ERROR = {\n    400: InvalidRequestError,\n    401: AuthenticationError,\n    403: PermissionDeniedError,\n    404: NotFoundError,\n    429: RateLimitError,\n}\n\n\ndef error_from_response(response, path):\n    \"\"\"Turn an HTTP error response into the right exception, whatever its body looks like.\"\"\"\n    try:\n        body = response.json()\n        message = body.get(\"message\") or body.get(\"title\") or response.reason\n    except ValueError:\n        message = response.reason or \"Unknown error\"\n    cls = STATUS_TO_ERROR.get(response.status_code)\n    if cls is None:\n        cls = ServerError if response.status_code >= 500 else CalendlyError\n    return cls(response.status_code, message, path)\n", "logging_config.py": "\"\"\"Logging: one structured JSON line per action, with secrets and personal data masked.\n\nLogs answer \"what did the integration do, and when?\" for debugging and audit,\nwithout ever containing an access token or a full email address.\n\"\"\"\nimport json\nimport logging\nimport re\nimport sys\nfrom datetime import datetime, timezone\n\nTOKEN_PATTERN = re.compile(r\"(Bearer\\s+)[A-Za-z0-9._\\-]+\", re.IGNORECASE)\nEMAIL_PATTERN = re.compile(r\"([A-Za-z0-9._%+\\-])[A-Za-z0-9._%+\\-]*@([A-Za-z0-9.\\-]+)\")\n\n\ndef redact(text):\n    text = TOKEN_PATTERN.sub(r\"\\1[REDACTED]\", str(text))\n    return EMAIL_PATTERN.sub(r\"\\1***@\\2\", text)\n\n\nclass JsonFormatter(logging.Formatter):\n    def format(self, record):\n        entry = {\n            \"time\": datetime.now(timezone.utc).isoformat(timespec=\"seconds\"),\n            \"level\": record.levelname,\n            \"event\": redact(record.getMessage()),\n        }\n        for key in (\"method\", \"path\", \"status\", \"attempt\", \"wait_seconds\",\n                    \"rate_limit_remaining\", \"page\", \"records\", \"stage\"):\n            if hasattr(record, key):\n                entry[key] = redact(getattr(record, key))\n        return json.dumps(entry)\n\n\ndef get_logger(name=\"calendly_integration\", level=\"INFO\", log_file=None):\n    logger = logging.getLogger(name)\n    if logger.handlers:\n        return logger\n    logger.setLevel(level)\n    handler = logging.FileHandler(log_file) if log_file else logging.StreamHandler(sys.stdout)\n    handler.setFormatter(JsonFormatter())\n    logger.addHandler(handler)\n    logger.propagate = False\n    return logger\n", "mapping.py": "\"\"\"Field mapping: translate Calendly's data structure into one standard\nCloudEagle user record, so Usage and License Management work the same for\nevery app. (The CloudEagle record shape is an assumption to confirm with the\nCloudEagle team.)\n\nCalendly field                              -> CloudEagle field\norganization_membership.user.uri            -> external_id\norganization_membership.user.name           -> name\norganization_membership.user.email          -> email\norganization_membership.role                -> role (owner / admin / user)\norganization_membership.created_at          -> added_on\ncount of scheduled events hosted (90 days)  -> usage_90d\nlatest activity log entry (Enterprise only) -> last_active\n\"Calendly\"                                  -> application\n\"\"\"\n\nAPPLICATION = \"Calendly\"\n\n\ndef to_cloudeagle_record(membership, meetings, last_active, activity_available):\n    user = membership[\"user\"]\n    usage = meetings.get(user[\"uri\"], 0)\n    active_signal = usage > 0 or bool(last_active)\n    return {\n        \"application\": APPLICATION,\n        \"external_id\": user[\"uri\"],\n        \"name\": user.get(\"name\"),\n        \"email\": user.get(\"email\"),\n        \"role\": membership.get(\"role\"),\n        \"added_on\": membership.get(\"created_at\"),\n        \"usage_90d\": usage,\n        \"usage_metric\": \"meetings_hosted\",\n        \"last_active\": last_active if activity_available else None,\n        \"last_active_available\": activity_available,\n        \"status\": \"active\" if active_signal else \"inactive\",\n    }\n\n\ndef map_all(memberships, meetings, activity, activity_available):\n    return [to_cloudeagle_record(m, meetings, activity.get(m[\"user\"][\"uri\"]), activity_available)\n            for m in memberships]\n", "sync.py": "\"\"\"Entry point: run the integration for one stage.\n\n    python -m calendly_integration.sync --stage sandbox\n    python -m calendly_integration.sync --stage production --limited   # read-only, 1 page, nothing saved\n    python -m calendly_integration.sync --stage production\n\nStage gate: production will not run unless the sandbox run has passed\n(reports/sandbox_report.json with \"passed\": true). The limited production run\nmust pass before a full production sync.\n\"\"\"\nimport argparse\nimport json\nimport os\nimport sys\nfrom datetime import datetime, timezone\n\nimport yaml\n\nfrom .auth import build_auth\nfrom .client import CalendlyClient\nfrom .logging_config import get_logger\nfrom .mapping import map_all\nfrom .usage import last_activity_per_user, meetings_per_user\nfrom .users import get_organization_uri, list_members\n\nHERE = os.path.dirname(os.path.abspath(__file__))\nREPORTS = os.path.join(HERE, \"reports\")\n\n\ndef load_config(stage):\n    with open(os.path.join(HERE, \"config\", f\"{stage}.yaml\")) as f:\n        return yaml.safe_load(f)\n\n\ndef _report(name):\n    path = os.path.join(REPORTS, name)\n    if not os.path.exists(path):\n        return None\n    with open(path) as f:\n        return json.load(f)\n\n\ndef check_stage_gate(stage, limited):\n    if stage != \"production\":\n        return\n    sandbox = _report(\"sandbox_report.json\")\n    if not sandbox or not sandbox.get(\"passed\"):\n        sys.exit(\"Blocked: run and pass the sandbox stage before production.\")\n    if not limited:\n        trial = _report(\"production_limited_report.json\")\n        if not trial or not trial.get(\"passed\"):\n            sys.exit(\"Blocked: run and pass the limited production run (--limited) first.\")\n\n\ndef run(stage, limited=False, client=None):\n    config = load_config(stage)\n    logger = get_logger(level=config.get(\"log_level\", \"INFO\"))\n    check_stage_gate(stage, limited)\n    max_pages = 1 if limited else None\n    logger.info(\"sync started\", extra={\"stage\": stage + (\" (limited)\" if limited else \"\")})\n\n    client = client or CalendlyClient(\n        base_url=config[\"base_url\"], auth=build_auth(config[\"auth_method\"]),\n        logger=logger, allowed_hosts=config[\"allowed_hosts\"])\n\n    org = get_organization_uri(client)\n    members = list_members(client, org, logger, max_pages)\n    meetings = meetings_per_user(client, org, logger, config[\"usage_window_days\"], max_pages)\n    activity, available = last_activity_per_user(client, org, logger,\n                                                 config[\"usage_window_days\"], max_pages)\n    records = map_all(members, meetings, activity, available)\n\n    summary = {\n        \"stage\": stage, \"limited\": limited,\n        \"finished_at\": datetime.now(timezone.utc).isoformat(timespec=\"seconds\"),\n        \"users\": len(records),\n        \"inactive_users\": sum(r[\"status\"] == \"inactive\" for r in records),\n        \"last_active_available\": available,\n        \"passed\": len(records) > 0,\n    }\n    logger.info(\"sync finished\", extra={\"records\": len(records)})\n\n    os.makedirs(REPORTS, exist_ok=True)\n    name = f\"{stage}{'_limited' if limited else ''}_report.json\"\n    with open(os.path.join(REPORTS, name), \"w\") as f:\n        json.dump(summary, f, indent=2)\n\n    if not limited and config.get(\"deliver_to_cloudeagle\"):\n        out = os.path.join(REPORTS, f\"{stage}_records.json\")\n        with open(out, \"w\") as f:\n            json.dump(records, f, indent=2)  # hand-off point to CloudEagle ingestion (assumed)\n    return summary, records\n\n\ndef main():\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\"--stage\", choices=[\"sandbox\", \"production\"], required=True)\n    parser.add_argument(\"--limited\", action=\"store_true\",\n                        help=\"read-only first page only, nothing saved\")\n    args = parser.parse_args()\n    summary, _ = run(args.stage, args.limited)\n    print(json.dumps(summary, indent=2))\n\n\nif __name__ == \"__main__\":\n    main()\n", "config/sandbox.yaml": "# Sandbox stage: CloudEagle's simulated Calendly, or a Calendly trial account.\n# Calendly has no developer sandbox, so trial accounts are Calendly's own suggestion.\nbase_url: http://localhost:8765          # simulated Calendly; use https://api.calendly.com for a trial account\nallowed_hosts: [localhost, api.calendly.com]\nauth_method: pat                         # token read from CALENDLY_TOKEN, never stored here\nusage_window_days: 90\nlog_level: INFO\ndeliver_to_cloudeagle: false\n", "config/production.yaml": "# Production stage: the customer's real Calendly organization (read-only).\nbase_url: https://api.calendly.com\nallowed_hosts: [api.calendly.com]\nauth_method: oauth                       # recommended for organizations; PAT also supported\nusage_window_days: 90\nlog_level: INFO\ndeliver_to_cloudeagle: true\n", "README.md": "# Calendly integration for CloudEagle (AI-generated, read-only)\n\nRetrieves Calendly users and usage and maps them to CloudEagle's standard user record.\n\n## What it needs\n- A Calendly **Owner or Admin** token (Calendly only lists all organization members for these roles).\n- Token in the environment (`CALENDLY_TOKEN`) or from your secrets vault. Never in code or config.\n- Python 3.10+, `pip install requests pyyaml`.\n\n## Run order (enforced by the code)\n1. **Simulated sandbox** (CloudEagle): `python -m pytest tests` (no account needed)\n2. **Trial account**: point `config/sandbox.yaml` at `https://api.calendly.com`, then\n   `python -m calendly_integration.sync --stage sandbox`. Check the user count against Calendly's admin panel.\n3. **Limited production run**: `python -m calendly_integration.sync --stage production --limited`\n   (read-only, first page only, nothing saved)\n4. **Full production sync**: `python -m calendly_integration.sync --stage production`\n\nProduction refuses to run until steps 2 and 3 have passed.\n\n## Usage signals\n- Meetings hosted in the last 90 days (all plans), from `/scheduled_events`.\n- Last activity (Calendly Enterprise only), from `/activity_log_entries`. On other plans this is marked unavailable and the sync continues.\n"};
const CALENDLY_DOCS = "Calendly API v2 reference (key sections, captured from developer.calendly.com on 23 Oct 2026)\n\nOVERVIEW\nREST API. Base URL: https://api.calendly.com. All requests and responses are JSON. Send Accept: application/json.\n\nAUTHENTICATION\nTwo methods, both sent as \"Authorization: Bearer <token>\".\n- Personal Access Token: created under Integrations > API & Webhooks. Tokens act with the permissions of the user who created them.\n- OAuth 2.0 (authorization code flow) for applications used by other organizations. Token endpoint: https://auth.calendly.com/oauth/token (grant_type=refresh_token to refresh). Only 8 OAuth tokens per user can be requested within 1 minute.\n\nFINDING THE USER AND ORGANIZATION URI\nGET /users/me returns {\"resource\": {...}} for the token owner. For personal access tokens, the user URI is resource.uri and the organization URI is resource.current_organization.\n\nLIST ORGANIZATION MEMBERSHIPS\nGET /organization_memberships\nQuery parameters: organization (full organization URI), user (full user URI), email, role (owner | admin | user), count (1-100, default 20), page_token.\nListing all members of an organization requires an Owner or Admin token.\nResponse: {\"collection\": [ { \"uri\", \"role\", \"user\": { \"uri\", \"name\", \"slug\", \"email\", \"scheduling_url\", \"timezone\", \"avatar_url\", \"locale\", \"created_at\", \"updated_at\" }, \"organization\", \"created_at\", \"updated_at\" } ], \"pagination\": { \"count\", \"next_page\", \"previous_page\", \"next_page_token\", \"previous_page_token\" } }\n\nLIST EVENTS\nGET /scheduled_events\nQuery parameters: organization (requires admin/owner), user, group, min_start_time, max_start_time (UTC, e.g. 2020-01-02T03:04:05.678123Z), status (active | canceled), count (1-100, default 20), sort (start_time:asc | start_time:desc), invitee_email, page_token.\nEach event: uri, name, status, start_time, end_time, event_type, location, invitees_counter, event_memberships (array of {user, user_email, user_name, buffered_start_time, buffered_end_time}), event_guests, cancellation, created_at, updated_at.\n\nLIST ACTIVITY LOG ENTRIES\nGET /activity_log_entries \u2014 requires an Enterprise subscription.\nQuery parameters: organization (required), search_term, actor, sort, min_occurred_at, max_occurred_at, namespace, action, count (1-100, default 20), page_token.\nEach entry: uri, occurred_at, organization, actor {uri, display_name, organization, type}, action, namespace, details.\nThe activity log records logins and user changes for Enterprise owners and admins.\n\nPAGINATION\nList endpoints are cursor-based. Pass count (max 100) and page_token. Read pagination.next_page_token from the response; it is null on the last page.\n\nRATE LIMITS\nPaid plans: 500 requests per minute per user. Free plan: 50 requests per minute.\nEvery response includes X-RateLimit-Limit, X-RateLimit-Remaining and X-RateLimit-Reset (seconds until reset).\nExceeding the limit returns HTTP 429 Too Many Requests. Wait until the reset time before retrying; use backoff.\n\nERRORS\n400 invalid argument, 401 unauthenticated (token invalid or revoked), 403 permission denied (role or plan), 404 resource not found, 429 too many requests, 500 internal error. Error bodies are JSON with \"title\" and \"message\".\n\nTESTING\nCalendly has no dedicated developer sandbox; use trial accounts for testing.\n";

function toast(msg, action){
  const box = document.getElementById("toasts"); const el = document.createElement("div"); el.className = "toast";
  el.innerHTML = `<span>${esc(msg)}</span>${action?`<button>${esc(action.label)}</button>`:""}`;
  if (action) el.querySelector("button").onclick = () => { el.remove(); action.run(); };
  while (box.children.length >= 2) box.firstChild.remove();
  box.append(el); setTimeout(()=>el.remove(), action?7000:4200);
}

}

const STEP_NAMES = ["Create the code","Test it","Turn it on"];
function stepper(cur){
  const done = n => (n===1 && I().files && I().sim?.passed) || (n===2 && I().testSigned) || (n===3 && I().status==="Live");
  const can = n => n===1 || (n===2 && done(1)) || (n===3 && done(2));
  const st = (n) => {
    const cls = n===cur ? "cur" : done(n) ? "done" : can(n) ? "" : "locked";
    const sub = n===cur ? "You are here" : done(n) ? "Done" : can(n) ? "Ready" : "Not yet";
    return `<button class="step ${cls}" data-step="${n}" ${can(n)?"":"disabled"}><span class="dot">${done(n)&&n!==cur?"✓":n}</span><span class="lbl"><b>${STEP_NAMES[n-1]}</b><span>${sub}</span></span></button>`;
  };
  return `<div class="stepper">${st(1)}<span class="track ${done(1)?"full":""}"><i></i></span>${st(2)}<span class="track ${done(2)?"full":""}"><i></i></span>${st(3)}
    <span class="sp"></span><span class="small muted">Step ${cur} of 3 · your progress is saved</span><button class="btn sm" data-act="copylink">Copy link</button></div>`;
}
function nudge(kind, title, text, actions=""){
  const ic = {info:"i", warn:"!", good:"✓", bad:"!"}[kind];
  return `<div class="nudge ${kind}" role="status"><span class="ic">${ic}</span><span class="tx"><b>${title}</b>${text?`<span class="small">${text}</span>`:""}</span>${actions}</div>`;
}
function statusPill(s){ const m={"Requested":"grey","In progress":"blue","Waiting for approval":"amber","Live":"green","Changes requested":"red","Synced":"green","Not connected":"grey"}; return `<span class="pill ${m[s]||"grey"}">${esc(s)}</span>`; }
const stepLabel = () => { const x = I(); if (!x) return "—"; if (x.status==="Live") return "Live"; if (x.builder==="ce") return "—"; return `Step ${x.step} of 3`; };

function appList(){

function appInfo(name){
  const c = CATALOGUE[name] || {cat:"Custom app", desc:`Brings in your ${name} users and how much each person uses ${name}. Built with AI from ${name}'s API docs.`, reads:["Users","Usage","Roles"], metric:"Activity (90 days)", lic:60, price:10, n:48, seed:13};
  const st = S.apps[name] || {};
  const custom = S.live && I() && I().app===name;
  return {...c, name, custom, status: st.status || (custom ? "Synced" : c===CATALOGUE.PagerDuty ? "Not connected" : "Synced"), freq: st.freq || "Daily", alerts: st.alerts!==false, marked: st.marked || [], lastSync: st.lastSync || "Today, 6:00 AM"};
}
function rng(seed){ let s = seed*9301+49297; return () => (s = (s*9301+49297)%233280)/233280; }
function appUsers(name){
  const a = appInfo(name);
  if (name==="Calendly" || a.custom){
    const counts = {}; DATA.events.forEach(u=>counts[u]=(counts[u]||0)+1);
    return DATA.users.map(u=>({name:u.name, email:u.email, role:u.role, use:counts[u.uri]||0}));
  }
  const r = rng(a.seed); const scale = {Zoom:30, Slack:90, PagerDuty:12, Okta:160}[name] || 20;
  return DATA.users.slice(0, a.n).map((u,i)=>{ const z = r(); return {name:u.name, email:u.email, role:i<3?"admin":"member", use: z<0.26 ? 0 : Math.max(1, Math.round(r()*scale))}; });
}

function scrIntegrations(){

    if (x.status==="Waiting for approval" && x.builder==="dev") banner = nudge("warn", `Ravi finished the ${esc(x.app)} integration. It needs your approval.`, "Check his test, connect your company's account and turn it on.", `<button class="btn primary" data-act="openBuild3">Review and approve</button>`);

    else if (x.builder==="dev") banner = nudge("info", `Ravi Menon is building the ${esc(x.app)} integration`, `${stepLabel()}. We'll let you know when it's ready for you to approve.`);
    else banner = nudge("info", `The CloudEagle team is building ${esc(x.app)}`, "We'll let you know when it's ready.");
  } else if (S.live && x?.status==="Live" && !S.dismissLive) {
    const inactive = appUsers(x.app).filter(u=>!u.use).length;
    banner = nudge("good", `${esc(x.app)} is now connected`, `${inactive} people haven't used it in 90 days. You could stop paying for those licences.`, `<button class="btn primary" data-act="openApp" data-app="${esc(x.app)}" data-tab="licences">See unused licences</button><button class="btn ghost" data-act="dismissLive" aria-label="Dismiss">✕</button>`);
  }
  const apps = appList().filter(n => !ql || n.toLowerCase().includes(ql));
  const knownMatch = appList().some(n=>n.toLowerCase()===ql);
  let missing = "";
  if (q && !knownMatch){
    const reqMatch = x && x.app.toLowerCase()===ql && x.status!=="Live";
    const seed = S.seeds.find(s=>s.app.toLowerCase()===ql);
    if (reqMatch) missing = `<div class="card reveal"><div class="spread"><div><b>${esc(x.app)} has already been requested</b><div class="row" style="margin-top:6px">${statusPill(x.status)}<span class="small muted">${stepLabel()}</span></div></div>
      ${x.status==="Waiting for approval"&&x.builder==="dev"?`<button class="btn primary" data-act="openBuild3">Review and approve</button>`:x.builder==="self"?`<button class="btn primary" data-act="openBuild">Continue</button>`:`<button class="btn" data-act="follow">Get updates</button>`}</div></div>`;
    else if (seed) missing = `<div class="card reveal"><div class="spread"><b>${esc(seed.app)} has already been requested by ${esc(seed.by)}</b><button class="btn" data-act="follow">Get updates</button></div></div>`;
    else if (!apps.length) missing = `<div class="card reveal"><div class="empty"><div class="ic">⌕</div><b style="font-size:15px">No App found</b>

/* ---------------- safety checks (language-agnostic port) ---------------- */
function safetyChecks(files, appName, docsText){
  const base = (S.I?.understanding?.base_url||"").replace(/^https?:\/\//,"").split("/")[0];
  const root = base.split(".").slice(-2).join(".") || appName.toLowerCase()+".com";
  const src = Object.entries(files).filter(([n])=>!/test/i.test(n) && !/\.(md|ya?ml|json)$/i.test(n));
  const find = (re, allow) => src.flatMap(([n,s]) => s.split("\n").map((l,i)=>re.test(l) && !(allow&&allow(n,l)) ? `${n}:${i+1}` : null).filter(Boolean));
  const rows = [];
  const writes = find(/(\.(post|put|patch|delete)\s*\(|method\s*[:=]\s*["'](POST|PUT|PATCH|DELETE)["']|Method(Post|Put|Patch|Delete)\b|\.(POST|PUT|PATCH|DELETE)\s*\()/, (n,l)=>/auth/i.test(n) && /token|oauth|refresh/i.test(l+n));
  rows.push({label:"Read-only: no create/update/delete", pass:!writes.length, detail:writes.slice(0,3).join(", ")});
  const hosts = src.flatMap(([n,s]) => [...s.matchAll(/https?:\/\/([A-Za-z0-9.\-]+)/g)].map(m=>m[1]).filter(h=>!(h===root||h.endsWith("."+root)||h==="localhost"||h==="127.0.0.1")).map(h=>`${n}: ${h}`));
  rows.push({label:`Only calls ${appName}'s own domains`, pass:!hosts.length, detail:hosts.slice(0,3).join(", ")});
  const sec = find(/(Bearer\s+[A-Za-z0-9\-_.]{20,}|eyJ[A-Za-z0-9_\-]{20,}\.|(api[_-]?key|secret|password)\s*[:=]\s*["'][^"']{8,}["'])/i);
  rows.push({label:"No secrets in code", pass:!sec.length, detail:sec.slice(0,3).join(", ")});
  const dang = find(/(\beval\s*\(|\bexec\s*\(|import\s+(subprocess|pickle|socket|ctypes)|os\.system\(|child_process|Runtime\.getRuntime|"os\/exec"|new Function\()/);
  rows.push({label:"No dangerous calls", pass:!dang.length, detail:dang.slice(0,3).join(", ")});
  const all = src.map(([,s])=>s).join("\n");
  rows.push({label:"Logs mask tokens and emails", pass:/REDACTED|redact|mask/i.test(all), detail:/REDACTED|redact|mask/i.test(all)?"":"no log masking found"});
  rows.push({label:"Handles rate limits (429)", pass:/429|RateLimit|rate.?limit/i.test(all), detail:/429|RateLimit|rate.?limit/i.test(all)?"":"no 429 handling found"});
  const inj = [/ignore (all |any )?(previous|prior) instructions/i,/send (the )?(token|key|credentials|secret)/i,/(system|developer) prompt/i,/exfiltrat/i].filter(r=>r.test(docsText||""));
  rows.push({label:"Docs scanned for prompt injection", pass:!inj.length, detail:inj.length?"suspicious text in the docs":""});
  return rows;
}

/* ---------------- AI ---------------- */
async function api(path, body, signal){
  const r = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body), signal});
  const data = await r.json().catch(()=>({error:"The server returned an unreadable answer."}));
  if (!r.ok) throw {status:r.status, message:data.error || "Request failed"};
  return data;
}
async function animateWhile(steps, promise){
  prog = 0; render(); let done = false; promise.finally(()=>done=true);
  while (!done && prog < steps.length-1){ await sleep(900 + Math.random()*700); if (!done){ prog++; render(); } }
  try { return await promise; } finally { prog = steps.length; render(); await sleep(250); }
}
const resetBelow = () => ({files:null, safety:null, sim:null, test:null, testConnected:false, testSigned:false, preview:null, prodConnected:false, confirmed:false});
async function readDocs(){
  const x = I();
  if (x.docsMode==="paste" && (x.docsText||"").trim().length < 200) return toast("Paste a few paragraphs of the API reference first.");
  if (x.docsMode==="link" && !/^https?:\/\//.test(x.docsUrl||"") && !isCal()) return toast("Add the API documentation link, or paste the text.");
  busy="read"; ctl = new AbortController();
  const replay = () => sleep(4200).then(()=>({understanding:CAL_UNDERSTANDING, source:"captured", replay:true}));
  const job = AI ? api("/api/understand", {app:x.app, docsUrl:x.docsMode==="link"?x.docsUrl:"", docsText:x.docsMode==="paste"?x.docsText:""}, ctl.signal) : (isCal() ? replay() : Promise.reject({message:"AI isn't configured on this deployment, so only Calendly can be read."}));
  try{
    const out = await animateWhile(READ_STEPS, job);
    busy=null; setI({understanding:out.understanding, uMode:out.replay?"replay":"live", uSource:out.source, ...resetBelow()});
  }catch(e){
    busy=null;
    if (isCal() && x.docsMode==="link"){ setI({understanding:CAL_UNDERSTANDING, uMode:"replay", uSource:"captured", ...resetBelow()}); toast((e.message||"The AI couldn't read the docs.")+" Using Calendly's API reference instead."); }
    else { render(); toast(e.message||"The AI couldn't read the docs."); }
  }
}
async function genCode(){
  const x = I(); busy="gen"; ctl = new AbortController(); render();
  const regen = !!x.files;
  const useAI = AI && x.uMode==="live";
  const job = useAI ? api("/api/generate", {app:x.app, language:x.language, understanding:x.understanding}, ctl.signal).then(o=>({files:o.files, mode:"live"}))
    : (isCal() && x.language==="python" ? sleep(5200).then(()=>({files:{...FILES}, mode:"replay"})) : Promise.reject({message:"AI isn't configured on this deployment."}));
  try{
    const out = await animateWhile(GEN_STEPS, job);
    busy=null;
    const first = Object.keys(out.files).find(n=>/paginat/i.test(n)) || Object.keys(out.files)[0];
    setI({files:out.files, fMode:out.mode, activeFile:first, safety:safetyChecks(out.files, x.app, x.docsText||CALENDLY_DOCS), sim:null, test:null, testConnected:false, testSigned:false, preview:null, prodConnected:false, confirmed:false, version: regen ? x.version+1 : x.version});
    if (I().safety.every(r=>r.pass) && isCal()) runSim();
  }catch(e){
    busy=null;
    if (e?.name==="AbortError"){ render(); return; }
    if (isCal() && x.language==="python"){ setI({files:{...FILES}, fMode:"replay", activeFile:"pagination.py", safety:safetyChecks(FILES,"Calendly",CALENDLY_DOCS), version: regen?x.version+1:x.version}); toast((e.message||"Generation failed.")+" Showing the reference Calendly integration."); runSim(); }
    else { render(); toast(e.message||"Generation failed."); }
  }
}

/* ---------------- simulated Calendly ---------------- */
const ORG = "https://api.calendly.com/organizations/ORG_ACME";
const TRIAL = (() => { const users = DATA.users.slice(0,12); const ids = new Set(users.map(u=>u.uri)); return {users, events:DATA.events.filter(e=>ids.has(e))}; })();
function simulator(ds, {rateLimitOnce=null}={}){
  const limited = new Set(); let remaining = 500;
  return function(path, params){
    if (rateLimitOnce===path && !limited.has(path)){ limited.add(path); return {status:429, reason:"Too Many Requests", remaining:"0", reset:"2", body:{title:"Too Many Requests", message:"Rate limit exceeded"}}; }
    remaining = Math.max(remaining-1, 2);
    const page = items => { const count=Math.min(+params.count||20,100), start=+(params.page_token||0), chunk=items.slice(start,start+count), nxt=start+count<items.length?start+count:null;
      return {collection:chunk, pagination:{count:chunk.length, next_page_token:nxt===null?null:"eyJvZmZzZXQiOi"+nxt, previous_page_token:null}}; };
    const ok = body => ({status:200, reason:"OK", remaining:String(remaining), reset:"60", body});
    if (path==="/users/me") return ok({resource:{uri:ds.users[0].uri, name:ds.users[0].name, current_organization:ORG}});
    if (params.organization!==ORG) return {status:404, reason:"Not Found", remaining:String(remaining), reset:"60", body:{title:"Resource Not Found"}};
    if (path==="/organization_memberships") return ok(page(ds.users.map(u=>({uri:u.uri.replace("users","organization_memberships"), role:u.role, created_at:u.created_at, user:{uri:u.uri, name:u.name, email:u.email}}))));
    if (path==="/scheduled_events") return ok(page(ds.events.map((h,i)=>({uri:`https://api.calendly.com/scheduled_events/EV_${i+1}`, status:"active", event_memberships:[{user:h}]}))));
    if (path==="/activity_log_entries") return {status:403, reason:"Permission Denied", remaining:String(remaining), reset:"60", body:{title:"Permission Denied", message:"This feature requires an Enterprise plan"}};
    return {status:404, reason:"Not Found", remaining:"0", reset:"60", body:{}};
  };
}
const preview = body => { const b = JSON.parse(JSON.stringify(body)); if (Array.isArray(b.collection) && b.collection.length>2){ const n=b.collection.length; b.collection=[b.collection[0], `… ${n-1} more`]; } return JSON.stringify(b,null,2); };
async function runIntegration(ds, {maxPages=null, rateLimitOnce=null, onReq=()=>{}, delay=160}={}){
  const handle = simulator(ds, {rateLimitOnce}); const reqs = []; let waited = 0; const t0 = performance.now();
  const decode = t => t ? String(+t.replace("eyJvZmZzZXQiOi","")) : t;
  async function get(path, params={}){
    for (let attempt=1; attempt<=5; attempt++){
      const qs = Object.entries(params).map(([k,v])=>`${k}=${k==="organization"?"{org}":k.endsWith("_time")?"{"+k.replace("_start_time","")+"}":k==="page_token"?"…":v}`).join("&");
      const r = handle(path, {...params, page_token:decode(params.page_token)});
      reqs.push({path:path+(qs?"?"+qs:""), status:r.status, reason:r.reason, remaining:r.remaining, reset:r.reset, body:preview(r.body), note:r.status===429?"→ retry":r.status===403?"handled":""});
      onReq(reqs); await sleep(delay);
      if (r.status===200) return r.body;
      if (r.status===429){ waited += +r.reset; await sleep(1600); continue; }
      throw r;
    }
  }
  async function all(path, params){ const out=[], pages=[]; let p={...params, count:100}, n=0;
    while(true){ n++; const d=await get(path,p); out.push(...d.collection); pages.push(d.collection.length); const t=d.pagination.next_page_token; if(!t||(maxPages&&n>=maxPages)) break; p={...p, page_token:t}; }
    return {out, pages}; }
  const org = (await get("/users/me")).resource.current_organization;
  const m = await all("/organization_memberships", {organization:org});
  const nowD = new Date(), ago = new Date(nowD-90*864e5);
  const ev = maxPages ? {out:[], pages:[]} : await all("/scheduled_events", {organization:org, min_start_time:ago.toISOString(), max_start_time:nowD.toISOString(), status:"active"});
  let errors = 0; if (!maxPages) { try { await all("/activity_log_entries", {organization:org}); } catch(e){ if (e.status!==403) errors++; } }
  const counts = {}; ev.out.forEach(e=>e.event_memberships.forEach(h=>counts[h.user]=(counts[h.user]||0)+1));
  const records = m.out.map(x=>({name:x.user.name, email:x.user.email, role:x.role, usage_90d:counts[x.user.uri]||0, status:(counts[x.user.uri]||0)>0?"active":"inactive"}));
  return {reqs, records, summary:{users:records.length, pages:m.pages, meetings:ev.out.length, waited, errors, mapped:7, duration:((performance.now()-t0)/1000).toFixed(1)}};
}
async function runSim(){
  runLog = {which:"sim", reqs:[]}; selReq.sim = null; render();
  const r = await runIntegration(DATA, {rateLimitOnce:"/scheduled_events", onReq:q=>{ runLog.reqs=q.slice(); render(); }});
  runLog = null; selReq.sim = r.reqs.findIndex(q=>q.status===429);
  setI({sim:{passed: r.summary.users===214 && r.summary.pages.join()==="100,100,14", reqs:r.reqs, summary:r.summary}});
  toast("Automatic checks passed: found all 214 people.");
}
async function runTest(){
  runLog = {which:"test", reqs:[]}; selReq.test = null; render();
  const liveMode = (I().testMode||"test")==="live";
  const r = await runIntegration(liveMode ? DATA : TRIAL, {maxPages: liveMode?1:null, onReq:q=>{ runLog.reqs=q.slice(); render(); }, delay:260});
  runLog = null;
  setI({test:{passed:true, mode:liveMode?"live":"test", at:now(), reqs:r.reqs, records:r.records, summary:r.summary}});
  toast("Test finished. Check the report, then approve it.");
}

/* ---------------- downloads ---------------- */
function saveBlob(blob, name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }
async function downloadCode(){
  if (!window.JSZip) return toast("Download isn't available right now.");
  const zip = new JSZip(); const dir = zip.folder(app().toLowerCase()+"-integration");
  Object.entries(I().files).forEach(([n,c])=>dir.file(n,c));
  saveBlob(await zip.generateAsync({type:"blob"}), `${app().toLowerCase()}-integration-v${I().version}.zip`);
}
function downloadReport(){
  const t = I().test; const rep = {app:app(), account:t.mode==="live"?"Acme Corp (read-only check)":"acme-test (trial)", version:I().version, language:LANGS[I().language], ran_at:t.at, passed:t.passed, summary:t.summary, requests:t.reqs.map(r=>({path:r.path, status:r.status})), sample:t.records.slice(0,5)};
  saveBlob(new Blob([JSON.stringify(rep,null,2)],{type:"application/json"}), `${app().toLowerCase()}-test-report-v${I().version}.json`);
}

  S.I = {app:appName, docsUrl: docsUrl || (isC?"https://developer.calendly.com/api-docs/4b402d5ab3edd-calendly-developer":""), docsMode:(docsUrl||isC)?"link":"paste", docsText:"", data:["Users","Usage","Licences and roles"], builder, language:"python", step:1, version:(S.liveVersion||0)+1, status:builder==="ce"?"Requested":"In progress", updated:"Just now", testMode:"test", ...resetBelow(), understanding:null};

  if (t.dataset.file){ S.I.activeFile=t.dataset.file; save(); render(); return; }
  if (t.dataset.req){ const [w,k]=t.dataset.req.split(":"); selReq[w]=+k; render(); return; }
  if (t.dataset.docs){ setI({docsMode:t.dataset.docs}); return; }
  if (t.dataset.edit){ const k=t.dataset.edit; if (S.editing===k){ S.editing=null; toast("Saved. The code will follow your change."); } else S.editing=k; render(); return; }
  if (t.dataset.note){ const n=S.notes[S.user].find(n=>String(n.id)===t.dataset.note); if(n){ n.read=true; S.open=null; save(); if(n.go){ openBuild(n.go==="build"?null:+n.go); } else render(); } return; }
  const a = t.dataset.act;
  if (a==="toggleBell"){ set({open:S.open==="bell"?null:"bell"}); }
  else if (a==="toggleAcct"){ set({open:S.open==="acct"?null:"acct"}); }
  else if (a==="switch"){ switchUser(); }
  else if (a==="goIntegrations"){ set({screen:S.user==="ravi"?"assigned":"integrations", viewStep:null, modal:null, query: S.screen==="integrations"?S.query:""}); }
  else if (a==="goAssigned"){ set({screen:"assigned", viewStep:null}); }
  else if (a==="resetDemo"){ try{ localStorage.removeItem(KEY); }catch(e){} S=fresh(); save(); lastKey=""; render(); toast("Demo reset. Start by searching for Calendly."); }
  else if (a==="addBlank"){ S.addDraft={app:"", docsUrl:""}; set({modal:"add"}); setTimeout(()=>document.getElementById("aApp")?.focus(),50); }
  else if (a==="addSelf"||a==="addAsk"){

    if (appList().some(n=>n.toLowerCase()===name.toLowerCase())){ set({modal:null, screen:"app", appName:appList().find(n=>n.toLowerCase()===name.toLowerCase()), tab:"overview"}); toast(`${name} is already available.`); return; }
    if (a==="addSelf"){ newIntegration(name, docs, "self"); S.modal=null; save(); openBuild(); }
    else { S.draft={app:name, docsUrl:docs || (name.toLowerCase()==="calendly"?"https://developer.calendly.com/api-docs/4b402d5ab3edd-calendly-developer":""), data:["Users","Usage","Licences and roles"], builder:"dev", email:"ravi.menon@acme.com"}; set({modal:"request"}); }
  }
  else if (a==="selfStart"){ newIntegration(S.query.trim(), "", "self"); save(); openBuild(); }
  else if (a==="openRequest"){ S.draft={app:S.query.trim()||"Calendly", docsUrl:S.query.trim().toLowerCase()==="calendly"?"https://developer.calendly.com/api-docs/4b402d5ab3edd-calendly-developer":"", data:["Users","Usage","Licences and roles"], builder:"dev", email:"ravi.menon@acme.com"}; set({modal:"request"}); }
  else if (a==="closeModal"){ set({modal:null}); }
  else if (a==="sendRequest"){
    const d=S.draft; d.app=document.getElementById("rApp").value.trim()||"Calendly"; d.docsUrl=document.getElementById("rDocs").value.trim();
    const em=document.getElementById("rEmail"); if (em) d.email=em.value.trim();

    if (d.builder==="dev"){ notify("ravi", `Priya Sharma asked you to build the ${d.app} integration`, "build"); save(); render(); toast(`Sent. Ravi Menon has been invited.`, {label:"Switch to Ravi", run:switchUser}); }
    else { save(); render(); toast("Sent to the CloudEagle team. We'll let you know when it's ready."); }
  }
  else if (a==="openBuild"){ openBuild(); }
  else if (a==="openBuild3"){ openBuild(3); }
  else if (a==="hideIntro"){ set({hideIntro:true}); }
  else if (a==="rowOpen"){ if (I().builder==="dev" && S.user==="priya") { if (I().status==="Waiting for approval") openBuild(3); else toast("Ravi is working on it. We'll let you know when it's ready."); } else openBuild(); }
  else if (a==="follow"){ toast("We'll email you when this changes."); }
  else if (a==="readDocs"){ readDocs(); }
  else if (a==="genCode"){ genCode(); }
  else if (a==="stop"){ ctl?.abort(); }
  else if (a==="runSim"){ runSim(); }
  else if (a==="skipSim"){ setI({sim:{passed:true, skipped:true, reqs:[], summary:null}}); }
  else if (a==="toStep2"){ setI({step:Math.max(I().step,2)}); S.viewStep=null; render(); }
  else if (a==="toStep3"){ const x=I(); const p={step:Math.max(x.step,3)}; if (x.testMode==="live" && x.builder==="self"){ p.prodConnected=true; } setI(p); S.viewStep=null; render(); }

  else if (a==="allowTest"){ S.modal=null; setI({testConnected:true}); toast("Connected. Now run the test."); }
  else if (a==="runTest"){ runTest(); }

  else if (a==="connectProd"){ set({modal:"oauthProd"}); }
  else if (a==="allowProd"){ S.modal=null; setI({prodConnected:true}); toast(`${app()} connected.`); }

    save(); render(); toast(`${app()} is on. 214 people imported.`, {label:"See unused licences", run:()=>set({screen:"app", appName:app(), tab:"licences"})});

  else if (a==="changesAsk"){ set({changes:true}); }
  else if (a==="cancelChanges"){ set({changes:false}); }
  else if (a==="sendChanges"){ const note=document.getElementById("chNote").value; setI({status:"Changes requested", step:2, testSigned:false, test:null, changeNote:note, prodConnected:false, preview:null, confirmed:false}); notify("ravi", `Priya asked for changes on ${app()}`, "2"); S.changes=false; save(); set({screen:"integrations", viewStep:null}); toast("Sent to Ravi.", {label:"Switch to Ravi", run:switchUser}); }
  else if (a==="openApp"){ set({screen:"app", appName:t.dataset.app||app(), tab:t.dataset.tab||"overview", open:null, sel:[], usageFilter:"all"}); }
  else if (a==="tab"){ set({tab:t.dataset.tab, sel:[]}); }

  else if (a==="markSave"){ const name=S.appName; const cur=appInfo(name).marked; patchApp(name, {marked:[...new Set([...cur, ...(S.sel||[])])]}); S.sel=[]; save(); render(); toast("Added to your renewal plan."); }
  else if (a==="clearMarks"){ patchApp(S.appName, {marked:[]}); toast("Removed from your renewal plan."); }
  else if (a==="saveSettings"){ patchApp(t.dataset.app, {freq:document.getElementById("freq").value, alerts:document.getElementById("alerts").checked}); toast("Settings saved."); }
  else if (a==="connectApp"){ set({modal:"oauthApp", connectName:t.dataset.app}); }
  else if (a==="allowApp"){ const n=S.connectName; S.modal=null; patchApp(n, {status:"Synced", lastSync:"Just now"}); toast(`${n} connected and synced.`); }
  else if (a==="disconnectAsk"){ set({modal:"disconnect", connectName:t.dataset.app}); }
  else if (a==="disconnect"){ const n=S.connectName; S.modal=null; patchApp(n, {status:"Not connected"}); toast(`${n} disconnected.`); }
  else if (a==="viewCode"){ set({modal:"code"}); }
  else if (a==="dismissLive"){ set({dismissLive:true}); }

    S.modal=null; save();
    if (x.builder==="dev"){ notify("ravi", `Priya asked for a new version of ${x.app} (version ${S.liveVersion+1})`, "build"); set({screen:"integrations"}); toast(`Version ${S.liveVersion+1} started. ${x.app} keeps running on version ${S.liveVersion}.`, {label:"Switch to Ravi", run:switchUser}); }
    else openBuild();
  }
  else if (a==="syncnow"){ patchApp(t.dataset.app, {lastSync:"Just now"}); toast(`${t.dataset.app} synced.`); }
  else if (a==="toCE"){ toast("Sent to the CloudEagle team."); }
  else if (a==="copylink"){ try{ await navigator.clipboard.writeText(location.href); toast("Link copied."); }catch(e){ toast("Copy the link from the address bar."); } }
});
