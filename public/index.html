<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fetch · Find and test any API</title>
<meta name="description" content="Name an app and the fields you need. Fetch finds the API docs, maps the endpoints and lets you test them live with your own trial key.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23191B20'/%3E%3Crect x='8' y='8' width='10' height='16' fill='%230057FF'/%3E%3Crect x='18' y='8' width='6' height='6' fill='%23D8FF70'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=IBM+Plex+Mono:wght@400;500&family=PT+Serif:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --ink:#191B20; --ink2:#4C4C4C; --muted:#828792; --muted2:#9CA3AF; --slate:oklch(0.446 0.03 256.8);
  --blue:#0057FF; --blue-soft:rgba(0,87,255,.06); --blue-line:rgba(0,87,255,.28); --sky:#79B9E0; --lime:#D8FF70;
  --line:#DFDFDF; --line2:#E5E5E5; --bg:#FAFAFA; --bg2:#F4F4F4; --card:#FFFFFF; --bad:#C4320A; --bad-soft:#FFF1EC; --warn:#8A5A00; --warn-soft:#FFF6DC;
  --serif:"PT Serif", Georgia, serif; --sans:"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif; --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --ease:cubic-bezier(.2,.8,.2,1); color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:var(--blue);text-decoration:none} a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;letter-spacing:-.03em;line-height:1.1}
h1{font-size:clamp(38px,6vw,64px);letter-spacing:-.04em}
h2{font-size:clamp(26px,3.4vw,34px)}
h3{font-size:20px;letter-spacing:-.02em}
h1 em,h2 em{font-style:normal;color:var(--blue)}
code,.mono{font-family:var(--mono);font-size:.86em}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.label{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(250,250,250,.86);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line2)}
.top .wrap{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.01em;font-size:17px;color:var(--ink)}
.brand:hover{text-decoration:none}
.mark{width:22px;height:22px;position:relative;background:var(--ink);flex:none}
.mark:before{content:"";position:absolute;left:5px;top:5px;width:7px;height:12px;background:var(--blue)}
.mark:after{content:"";position:absolute;left:12px;top:5px;width:5px;height:5px;background:var(--lime)}
.top .sp{flex:1}
.ghost{background:none;border:0;padding:6px 8px;font-family:var(--mono);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}
.ghost:hover{color:var(--ink)}

/* stepper */
.steps{max-width:1180px;margin:0 auto;padding:22px 20px 0;display:flex;gap:0;align-items:center;overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.st{display:flex;align-items:center;gap:8px;background:none;border:0;padding:6px 2px;white-space:nowrap;color:var(--muted2);font-size:14px;transition:color .2s}
.st .n{width:22px;height:22px;display:grid;place-items:center;border:1px solid var(--line);font-family:var(--mono);font-size:11px;background:var(--card);transition:all .25s var(--ease)}
.st.done{color:var(--ink2)} .st.done .n{background:var(--ink);border-color:var(--ink);color:#fff}
.st.cur{color:var(--ink);font-weight:500} .st.cur .n{border-color:var(--blue);background:var(--blue);color:#fff}
.st:disabled{cursor:default}
.st:not(:disabled):hover{color:var(--ink)}
.bar{flex:1;min-width:18px;height:1px;background:var(--line);margin:0 12px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease)}
.bar.on i{transform:scaleX(1)}

/* layout */
main{max-width:1180px;margin:0 auto;padding:26px 20px 80px}
.narrow{max-width:760px;margin:0 auto}
.enter{animation:rise .42s var(--ease) both}
.enter > *{animation:rise .5s var(--ease) both}
.enter > *:nth-child(2){animation-delay:.04s} .enter > *:nth-child(3){animation-delay:.08s} .enter > *:nth-child(4){animation-delay:.12s} .enter > *:nth-child(5){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes fade{from{opacity:0}}
.fade{animation:fade .3s var(--ease) both}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

.hero{padding:34px 0 30px;text-align:left}
.hero p{max-width:560px;color:var(--slate);font-size:17px;margin:16px 0 0}
.head{margin:8px 0 22px}
.head p{color:var(--slate);margin:10px 0 0;max-width:620px}

.panel{background:var(--card);border:1px solid var(--line);padding:26px}
.panel + .panel{margin-top:14px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px;flex-wrap:wrap}
.foot .r{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
hr.sep{border:0;border-top:1px solid var(--line2);margin:22px 0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:44px;padding:0 20px;border:1px solid var(--ink);background:var(--ink);color:#fff;font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;border-radius:0;transition:background .2s,border-color .2s,color .2s,transform .15s}
.btn:hover{background:#2b2e36;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn .arr{display:inline-block;transition:transform .25s var(--ease)}
.btn:hover .arr{transform:translateX(3px)}
.btn.blue{background:var(--blue);border-color:var(--blue)} .btn.blue:hover{background:#004ae0}
.btn.line{background:var(--card);color:var(--ink);border-color:var(--line)} .btn.line:hover{border-color:var(--ink)}
.btn.sm{height:34px;padding:0 13px;font-size:11.5px}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn .spin{width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.link{background:none;border:0;padding:0;color:var(--blue);font-size:14px}
.link:hover{text-decoration:underline}

/* inputs */
.field{display:block}
.field + .field{margin-top:16px}
.field .label{display:block;margin-bottom:8px}
.in{width:100%;height:48px;border:1px solid var(--line);background:var(--card);padding:0 14px;outline:none;border-radius:0;transition:border-color .2s,box-shadow .2s}
.in.lg{height:58px;font-size:19px;padding:0 18px}
.in:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
textarea.in{height:auto;min-height:150px;padding:12px 14px;font-family:var(--mono);font-size:12.5px;line-height:1.5;resize:vertical}
.in.mono{font-family:var(--mono);font-size:13px}
.err{color:var(--bad);font-size:13px;margin-top:6px}

/* app combo */
.combo{position:relative}
.combo .go{position:absolute;right:7px;top:7px;bottom:7px}
.combo .go .btn{height:44px}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--line);z-index:15;max-height:320px;overflow:auto;box-shadow:0 12px 32px rgba(25,27,32,.08);animation:rise .2s var(--ease) both}
.sugg button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:10px 14px;text-align:left}
.sugg button:hover,.sugg button.hi{background:var(--blue-soft)}
.sugg .d{margin-left:auto;font-size:12px;color:var(--muted)}
.logo{width:26px;height:26px;display:grid;place-items:center;background:var(--bg2);font-weight:600;font-size:12px;color:var(--ink2);position:relative;flex:none;overflow:hidden}
.logo img{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);object-fit:contain;background:var(--card)}
.logo:has(img){background:var(--card);border:1px solid var(--line2)}

.found{display:flex;align-items:center;gap:14px;border:1px solid var(--line);padding:14px 16px;margin-top:14px;background:var(--card)}
.found .t{min-width:0;flex:1}
.found .u{font-family:var(--mono);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap;background:var(--card)}
.tag.ok{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.tag.blue{background:var(--blue-soft);border-color:var(--blue-line);color:var(--blue)}
.tag.warn{background:var(--warn-soft);border-color:#F0DCA0;color:var(--warn)}
.tag.bad{background:var(--bad-soft);border-color:#F6C9B9;color:var(--bad)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}

.shimmer{position:relative;overflow:hidden;background:var(--bg2);height:14px}
.shimmer:after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);animation:sh 1.2s infinite}
@keyframes sh{to{transform:translateX(100%)}}
.searching{display:flex;gap:14px;align-items:center;border:1px dashed var(--line);padding:16px;margin-top:14px}

/* chips */
.chipbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:1px solid var(--line);background:var(--card);padding:10px;min-height:58px;cursor:text;transition:border-color .2s,box-shadow .2s}
.chipbox:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.chipbox input{border:0;outline:0;flex:1;min-width:160px;height:34px;font-family:var(--mono);font-size:14px;background:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 6px 0 12px;background:var(--ink);color:#fff;font-family:var(--mono);font-size:13px;animation:pop .25s var(--ease) both}
.chip button{border:0;background:none;color:#fff;opacity:.6;width:22px;height:22px;display:grid;place-items:center;font-size:16px;line-height:1}
.chip button:hover{opacity:1}
@keyframes pop{from{opacity:0;transform:scale(.9)}}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.qchip{height:30px;padding:0 11px;border:1px dashed var(--line);background:var(--card);font-family:var(--mono);font-size:12.5px;color:var(--ink2);transition:all .2s}
.qchip:hover{border-style:solid;border-color:var(--ink);color:var(--ink)}

/* progress */
.prog{list-style:none;margin:0;padding:0}
.prog li{display:flex;gap:12px;align-items:center;padding:9px 0;color:var(--muted2);transition:color .3s}
.prog li .ic{width:18px;height:18px;display:grid;place-items:center;flex:none}
.prog li.done{color:var(--ink2)} .prog li.cur{color:var(--ink)}
.prog li.cur .ic .spin{width:13px;height:13px;border:2px solid var(--blue);border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}

/* fields coverage */
.cov{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.cv{border:1px solid var(--line2);padding:10px 12px;background:var(--card);min-width:0}
.cv b{font-family:var(--mono);font-weight:500;font-size:13px}
.cv .w{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv.c-ok{border-left:3px solid var(--blue)} .cv.c-plan{border-left:3px solid #E0B341} .cv.c-miss{border-left:3px solid var(--bad)}

/* endpoints */
.ep{border:1px solid var(--line);background:var(--card);transition:border-color .2s}
.ep + .ep{margin-top:-1px}
.mod + .mod{margin-top:22px}
.modh{display:flex;align-items:baseline;gap:10px;margin:0 0 8px}
.ep summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.ep summary::-webkit-details-marker{display:none}
.ep summary:hover{background:var(--bg)}
.ep[open]{border-color:var(--ink);position:relative;z-index:1}
.meth{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.04em;color:#0A7A3E;background:#E8F7EE;padding:3px 7px;flex:none}
.path{font-family:var(--mono);font-size:13.5px;word-break:break-all}
.ep .sum{color:var(--muted);font-size:13.5px;margin-left:auto;text-align:right;max-width:46%}
.ep .chev{transition:transform .25s var(--ease);color:var(--muted2);flex:none}
.ep[open] .chev{transform:rotate(90deg)}
.ep .body{padding:4px 16px 16px 16px;display:grid;grid-template-columns:1fr 1fr;gap:18px;animation:fade .3s both}
.kv{width:100%;border-collapse:collapse;font-size:13px}
.kv td{padding:6px 0;border-bottom:1px solid var(--line2);vertical-align:top}
.kv td:first-child{font-family:var(--mono);font-size:12.5px;padding-right:16px;white-space:nowrap;width:1%}
.auth{display:grid;grid-template-columns:1.1fr 1fr;gap:26px}
.auth ol{margin:8px 0 0;padding-left:20px} .auth li{margin:5px 0}
.codeline{font-family:var(--mono);font-size:12.5px;background:var(--bg);border:1px solid var(--line2);padding:10px 12px;word-break:break-all}

/* tester */
.tester{display:grid;grid-template-columns:250px minmax(0,1fr);border:1px solid var(--line);background:var(--card);min-height:560px}
.side{border-right:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column}
.side .h{padding:14px 14px 10px;border-bottom:1px solid var(--line2)}
.side button.it{display:flex;align-items:center;gap:9px;width:100%;border:0;border-left:2px solid transparent;background:none;padding:10px 12px;text-align:left;font-size:13px;transition:background .15s}
.side button.it:hover{background:var(--card)}
.side button.it.on{background:var(--card);border-left-color:var(--blue)}
.side button.it .path{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .meth{font-size:10px;padding:2px 5px}
.side .grp{padding:12px 14px 6px}
.side .tick{margin-left:auto;font-size:11px}
.work{min-width:0;display:flex;flex-direction:column}
.guide{display:flex;gap:0;border-bottom:1px solid var(--line2);overflow-x:auto;scrollbar-width:none}
.guide .g{flex:1;min-width:150px;padding:11px 14px;display:flex;gap:9px;align-items:center;font-size:13px;color:var(--muted);border-right:1px solid var(--line2);background:none;border-top:0;border-left:0;border-bottom:0;text-align:left}
.guide .g:last-child{border-right:0}
.guide .g .n{width:20px;height:20px;display:grid;place-items:center;border:1px solid var(--line);font-family:var(--mono);font-size:10.5px;flex:none;background:var(--card);transition:all .25s}
.guide .g.ok{color:var(--ink)} .guide .g.ok .n{background:var(--lime);border-color:var(--lime)}
.guide .g.now{color:var(--ink);background:var(--blue-soft)} .guide .g.now .n{border-color:var(--blue);color:var(--blue)}
.reqbar{display:flex;gap:8px;padding:14px;border-bottom:1px solid var(--line2)}
.reqbar .m{height:44px;display:grid;place-items:center;padding:0 12px;border:1px solid var(--line);font-family:var(--mono);font-size:12.5px;color:#0A7A3E;background:var(--bg);flex:none}
.reqbar .in{height:44px;font-family:var(--mono);font-size:13px}
.tabs{display:flex;gap:4px;padding:0 14px;border-bottom:1px solid var(--line2)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:11px 8px;font-size:13.5px;color:var(--muted);transition:color .2s,border-color .2s}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.tabs button .c{font-family:var(--mono);font-size:11px;color:var(--muted2);margin-left:3px}
.tabs .sp{flex:1}
.pane{padding:14px;animation:fade .25s both}
table.grid{width:100%;border-collapse:collapse;font-size:13px}
table.grid th{font-weight:500;text-align:left;font-size:11.5px;font-family:var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line2)}
table.grid td{border-bottom:1px solid var(--line2);padding:2px;vertical-align:middle}
table.grid td.cb{width:34px;text-align:center}
table.grid input.c{width:100%;border:1px solid transparent;background:none;padding:8px 8px;font-family:var(--mono);font-size:12.5px;outline:0;border-radius:0}
table.grid input.c:focus{border-color:var(--blue);background:var(--card)}
table.grid .req{color:var(--bad);font-family:var(--mono);font-size:11px;margin-left:4px}
table.grid .in-tag{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;padding:0 8px}
.x{border:0;background:none;color:var(--muted2);width:28px;height:28px;font-size:16px} .x:hover{color:var(--bad)}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border:1px solid var(--line2);padding:11px 13px;font-size:13px;color:var(--ink2)}
.note.blue{background:var(--blue-soft);border-color:var(--blue-line)}
.note.bad{background:var(--bad-soft);border-color:#F6C9B9;color:#7a2208}
.note.warn{background:var(--warn-soft);border-color:#F0DCA0;color:#5c3d00}
.authgrid{display:grid;grid-template-columns:200px 1fr;gap:14px 18px;align-items:center;max-width:720px}
.authgrid .label{margin:0}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.pw{position:relative} .pw .in{padding-right:70px} .pw button{position:absolute;right:6px;top:8px;height:32px}
.resp{border-top:1px solid var(--line);flex:1;display:flex;flex-direction:column;min-height:260px}
.resp .rh{display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.resp .rh .tabs{border:0;padding:0}
.stat{font-family:var(--mono);font-size:12.5px;display:flex;gap:14px;margin-left:auto;align-items:center}
.code2{background:var(--bg2);color:#2a7d4f;padding:2px 7px}
.code2.e{color:var(--bad);background:var(--bad-soft)} .code2.w{color:var(--warn);background:var(--warn-soft)}
pre.json{margin:0;padding:14px;font-family:var(--mono);font-size:12.5px;line-height:1.6;overflow:auto;max-height:480px;white-space:pre;tab-size:2}
.j-k{color:#0057FF} .j-s{color:#1C7C54} .j-n{color:#A2470B} .j-b{color:#7C3AED} .j-z{color:var(--muted)}
.empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px;font-size:14px}
.empty .big{font-family:var(--serif);font-size:22px;color:var(--ink);letter-spacing:-.02em;margin-bottom:6px}

/* code */
.langs{display:inline-flex;border:1px solid var(--line);background:var(--card)}
.langs button{border:0;background:none;padding:0 16px;height:40px;font-size:14px;border-right:1px solid var(--line);transition:background .2s,color .2s}
.langs button:last-child{border-right:0}
.langs button.on{background:var(--ink);color:#fff}
.files{display:grid;grid-template-columns:220px minmax(0,1fr);border:1px solid var(--line);background:var(--card);margin-top:16px}
.files .fl{border-right:1px solid var(--line);background:var(--bg);padding:6px 0}
.files .fl button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 14px;font-family:var(--mono);font-size:12.5px;border-left:2px solid transparent}
.files .fl button.on{background:var(--card);border-left-color:var(--blue)}
pre.src{margin:0;padding:14px 0;font-family:var(--mono);font-size:12.5px;line-height:1.6;overflow:auto;max-height:520px;counter-reset:l}
pre.src span.l{display:block;padding:0 16px 0 0;white-space:pre}
pre.src span.l:before{counter-increment:l;content:counter(l);display:inline-block;width:42px;padding-right:14px;text-align:right;color:var(--muted2);user-select:none}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px 18px;margin-top:10px}
.checks div{display:flex;gap:8px;font-size:13.5px;align-items:baseline}
.ok-i{color:#0A7A3E} .bad-i{color:var(--bad)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;font-size:14px;max-width:min(560px,calc(100vw - 32px));z-index:50;display:flex;gap:14px;align-items:center;animation:rise .3s var(--ease) both}
.toast button{background:none;border:0;color:var(--lime);font-family:var(--mono);font-size:12px;text-transform:uppercase}
.banner{background:var(--lime);color:var(--ink);text-align:center;font-size:13px;padding:8px 16px}
footer.f{max-width:1180px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:12.5px;display:flex;gap:18px;flex-wrap:wrap}

@media (max-width:860px){
  .tester{grid-template-columns:minmax(0,1fr)}
  .side{border-right:0;border-bottom:1px solid var(--line)}
  .side .list{display:flex;overflow-x:auto}
  .side button.it{width:auto;white-space:nowrap;border-left:0;border-bottom:2px solid transparent}
  .side button.it.on{border-bottom-color:var(--blue)}
  .side .h,.side .grp{display:none}
  .auth{grid-template-columns:1fr}
  .ep .body{grid-template-columns:1fr}
  .ep .sum{display:none}
  .files{grid-template-columns:minmax(0,1fr)} .files .fl{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)} .files .fl button{white-space:nowrap;width:auto;border-left:0;border-bottom:2px solid transparent} .files .fl button.on{border-bottom-color:var(--blue)}
  .authgrid{grid-template-columns:1fr;gap:6px}
  .authgrid .label{margin-top:10px}
}
@media (max-width:560px){
  .panel{padding:18px}
  .top .label{display:none} .ghost{white-space:nowrap}
  .st .t{display:none} .st.cur .t{display:inline}
  .reqbar{flex-wrap:wrap} .reqbar .in{flex:1 1 200px}
  .stat{margin-left:0}
  .combo .go{position:static;margin-top:8px} .combo .go .btn{width:100%}
}
</style>
</head>
<body>
<div id="banner"></div>
<header class="top"><div class="wrap">
  <a class="brand" href="/" data-act="home"><span class="mark" aria-hidden="true"></span>Fetch</a>
  <span class="label" style="margin-left:6px">API finder &amp; tester</span>
  <span class="sp"></span>
  <button class="ghost" data-act="reset">Start over</button>
</div></header>
<nav class="steps" id="steps" aria-label="Progress"></nav>
<main id="main"></main>
<footer class="f"><span>Read-only: the tester only sends GET requests.</span><span>Your API key stays in this tab's memory. It is never saved or logged.</span><a href="https://github.com/onu-pm/integration-builder" target="_blank" rel="noopener">Source</a></footer>
<div id="toast"></div>
<script>
"use strict";
const KNOWN = [{"name":"GitHub","domain":"github.com","docs":"https://docs.github.com/en/rest"},{"name":"GitLab","domain":"gitlab.com","docs":"https://docs.gitlab.com/api/rest/"},{"name":"Slack","domain":"slack.com","docs":"https://api.slack.com/methods"},{"name":"Zoom","domain":"zoom.us","docs":"https://developers.zoom.us/docs/api/"},{"name":"Calendly","domain":"calendly.com","docs":"https://developer.calendly.com/api-docs"},{"name":"Asana","domain":"asana.com","docs":"https://developers.asana.com/reference/rest-api-reference"},{"name":"Notion","domain":"notion.so","docs":"https://developers.notion.com/reference/intro"},{"name":"Figma","domain":"figma.com","docs":"https://www.figma.com/developers/api"},{"name":"Miro","domain":"miro.com","docs":"https://developers.miro.com/reference/api-reference"},{"name":"Dropbox","domain":"dropbox.com","docs":"https://www.dropbox.com/developers/documentation/http/documentation"},{"name":"Box","domain":"box.com","docs":"https://developer.box.com/reference/"},{"name":"Zendesk","domain":"zendesk.com","docs":"https://developer.zendesk.com/api-reference/"},{"name":"HubSpot","domain":"hubspot.com","docs":"https://developers.hubspot.com/docs/api/overview"},{"name":"Intercom","domain":"intercom.com","docs":"https://developers.intercom.com/docs/references/rest-api/api.intercom.io"},{"name":"monday.com","domain":"monday.com","docs":"https://developer.monday.com/api-reference/"},{"name":"ClickUp","domain":"clickup.com","docs":"https://developer.clickup.com/reference"},{"name":"Airtable","domain":"airtable.com","docs":"https://airtable.com/developers/web/api/introduction"},{"name":"Trello","domain":"trello.com","docs":"https://developer.atlassian.com/cloud/trello/rest/"},{"name":"Jira","domain":"atlassian.com","docs":"https://developer.atlassian.com/cloud/jira/platform/rest/v3/intro/"},{"name":"Confluence","domain":"atlassian.com","docs":"https://developer.atlassian.com/cloud/confluence/rest/v2/intro/"},{"name":"Stripe","domain":"stripe.com","docs":"https://docs.stripe.com/api"},{"name":"Shopify","domain":"shopify.com","docs":"https://shopify.dev/docs/api/admin-rest"},{"name":"Linear","domain":"linear.app","docs":"https://linear.app/developers"},{"name":"PagerDuty","domain":"pagerduty.com","docs":"https://developer.pagerduty.com/api-reference/"},{"name":"Okta","domain":"okta.com","docs":"https://developer.okta.com/docs/api/"},{"name":"Mailchimp","domain":"mailchimp.com","docs":"https://mailchimp.com/developer/marketing/api/"},{"name":"Typeform","domain":"typeform.com","docs":"https://www.typeform.com/developers/"},{"name":"Twilio","domain":"twilio.com","docs":"https://www.twilio.com/docs/usage/api"},{"name":"Freshdesk","domain":"freshdesk.com","docs":"https://developers.freshdesk.com/api/"},{"name":"DocuSign","domain":"docusign.com","docs":"https://developers.docusign.com/docs/esign-rest-api/reference/"},{"name":"Webex","domain":"webex.com","docs":"https://developer.webex.com/docs/api/getting-started"},{"name":"SurveyMonkey","domain":"surveymonkey.com","docs":"https://api.surveymonkey.com/v3/docs"},{"name":"Pipedrive","domain":"pipedrive.com","docs":"https://developers.pipedrive.com/docs/api/v1"},{"name":"Todoist","domain":"todoist.com","docs":"https://developer.todoist.com/rest/v2/"}];
const STORE = "fetch-v5";
const STEPS = [[1,"App"], [3,"APIs"], [4,"Test"], [5,"Code"]];   // internal step 2 (fields) is now optional, on the APIs page
const LANGS = {python:"Python", typescript:"Node.js", java:"Java", go:"Go"};
const COMMON = ["id","email","name","role","status","created_at","last_login","team"];
const FIND_STEPS = ["Opening the docs", "Following related pages", "Picking the endpoints", "Working out authentication"];
const GEN_STEPS = ["Reading the endpoint spec", "Writing the client and auth", "Writing endpoints and paging", "Running safety checks"];

/* ---------- state ---------- */
const blank = () => ({step:1, app:"", domain:"", docsUrl:"", docsSource:"", docsVerified:false, docsEdit:false, docsMode:"link", docsText:"", fields:[], result:null, meta:null, staleFields:false,
  ep:null, view:"req", reqTab:"params", respTab:"body", reqs:{}, auth:null, lang:"python", files:null, activeFile:null, safety:null, filesLang:null});
let S = blank();
try { const raw = localStorage.getItem(STORE); if (raw) S = {...blank(), ...JSON.parse(raw)}; } catch {}
const KEY = {token:"", user:"", pass:"", show:false};   // never persisted
const RESP = {};                                      // responses kept in memory only
let suggHide = false, busy = null, prog = 0, ctl = null, lastStep = 0, AI = true, suggIdx = -1, findErr = "", discErr = null, genErr = "";
function save(){ try { localStorage.setItem(STORE, JSON.stringify(S)); } catch {} }
function set(p){ Object.assign(S, p); save(); render(); }
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const $ = s => document.querySelector(s);
const host = u => { try { return new URL(u).host; } catch { return ""; } };
const isUrl = u => /^https?:\/\/[^\s.]+\.[^\s]+$/.test(String(u||"").trim());
function toast(msg, action){
  const el = $("#toast"); clearTimeout(toast.t);
  el.innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${action?`<button data-act="${esc(action[1])}">${esc(action[0])}</button>`:""}</div>`;
  toast.t = setTimeout(()=>el.innerHTML="", 6000);
}
function logo(name, domain, size){
  const k = KNOWN.find(a=>a.name.toLowerCase()===String(name).toLowerCase());
  const d = domain || k?.domain || "";
  const st = size ? ` style="width:${size}px;height:${size}px;font-size:${Math.round(size*.42)}px"` : "";
  return `<span class="logo"${st}>${esc(String(name||"?")[0].toUpperCase())}${d?`<img src="https://www.google.com/s2/favicons?domain=${esc(d)}&sz=64" alt="" loading="lazy" onerror="this.remove()">`:""}</span>`;
}
const reach = () => { let m = 1; if (S.app && (isUrl(S.docsUrl) || (S.docsMode==="paste" && S.docsText.trim().length>=200))) m = 3; if (m===3 && S.result && S.result.endpoints?.length) m = 5; return m; };

/* ---------- render ---------- */
function render(){
  if (S.step===2) S.step = 3;
  const r = reach(); if (S.step > r) S.step = r === 3 && S.step > 3 ? 3 : r === 1 ? 1 : S.step;
  if (S.step===3 && !S.result && busy!=="disc" && !discErr) S.step = 1;
  $("#steps").innerHTML = STEPS.map(([n,t],i)=>{ const cls = n===S.step?"cur":n<S.step?"done":"";
    return `${i?`<span class="bar ${n<=S.step?"on":""}"><i></i></span>`:""}<button class="st ${cls}" data-act="go" data-s="${n}" ${n>r?"disabled":""} aria-current="${n===S.step?"step":"false"}"><span class="n">${n<S.step?"✓":i+1}</span><span class="t">${t}</span></button>`; }).join("");
  const anim = S.step !== lastStep; lastStep = S.step;
  const view = [vApp, vFields, vApis, vTest, vCode][S.step-1]();
  const m = $("#main");
  const keep = document.activeElement?.id; const sel = keep && document.activeElement.selectionStart;
  m.innerHTML = `<div class="${anim?"enter":""}">${view}</div>`;
  if (anim) window.scrollTo({top:0, behavior:"smooth"});
  if (keep){ const el = document.getElementById(keep); if (el){ el.focus(); try{ if (sel!=null) el.setSelectionRange(sel, sel); }catch{} } }
  if (S.step===4) syncUrl();
  if (S.step===1) suggestions();
}

/* step 1: app + docs */
function vApp(){
  const has = S.app && isUrl(S.docsUrl) && !S.docsEdit;
  const tagFor = S.docsSource==="postman" ? (S.docsLinkedBy==="vendor" ? `<span class="tag ok">Postman docs · linked by ${esc(S.app)}</span>` : `<span class="tag warn">Postman docs · check the publisher</span>`) : S.docsSource==="library" ? `<span class="tag ok">Checked link</span>` : S.docsSource==="ai" ? (S.docsVerified?`<span class="tag blue">Found by AI · opens</span>`:`<span class="tag warn">Found by AI · check it</span>`) : `<span class="tag">Your link</span>`;
  let docs = "";
  if (busy==="find") docs = `<div class="searching fade">${logo(S.app,S.domain,30)}<div style="flex:1"><div>Searching the web for the official ${esc(S.app)} API reference…</div><div class="shimmer" style="width:60%;margin-top:8px"></div></div></div>`;
  else if (has) docs = `<div class="found fade">${logo(S.app,S.domain,34)}<div class="t"><div class="small muted">API reference</div><a class="u" href="${esc(S.docsUrl)}" target="_blank" rel="noopener">${esc(S.docsUrl.replace(/^https?:\/\//,""))}</a></div>${tagFor}<button class="link" data-act="editDocs">Change</button></div>${(S.docsAlts||[]).length?`<div class="small muted fade" style="margin-top:8px">Not it? Also found: ${S.docsAlts.map(u=>`<button class="link small" data-act="useAlt" data-u="${esc(u)}" style="margin-left:8px;font-family:var(--mono);font-size:12px">${esc(u.replace(/^https?:\/\//,""))}</button>`).join("")}</div>`:""}`;
  else if (S.app && (S.docsEdit || S.docsSource==="none")) docs = `<div class="fade" style="margin-top:18px">
      ${findErr?`<div class="note warn" style="margin-bottom:12px">${esc(findErr)}</div>`:""}
      ${S.docsMode==="link" ? `<label class="field"><span class="label">API docs link</span><input class="in mono" id="docsUrl" placeholder="https://developer.example.com/api" value="${esc(S.docsUrl)}" data-in="docsUrl" inputmode="url"></label>
        <div class="row small" style="margin-top:10px;gap:16px">${S.docsSource!=="none"?`<button class="link" data-act="findDocs">Search again with AI</button>`:""}<button class="link" data-act="pasteMode">Paste the docs text instead</button></div>`
      : `<label class="field"><span class="label">API reference text</span><textarea class="in" id="docsText" data-in="docsText" placeholder="Paste the endpoint reference: paths, parameters, auth, example responses.">${esc(S.docsText)}</textarea></label>
        <div class="row small" style="margin-top:10px"><button class="link" data-act="linkMode">Use a link instead</button><span class="muted" style="margin-left:auto">${S.docsText.trim().length} characters${S.docsText.trim().length<200?" · at least 200 needed":""}</span></div>`}
    </div>`;
  const canGo = reach() >= 3;
  return `<section class="hero"><h1>Find any API.<br><em>Test it live.</em></h1><p>Name the app. Fetch finds the docs, shows the endpoints, and lets you call them with your own trial key.</p></section>
  <div class="panel narrow" style="margin:0">
    <label class="field"><span class="label">Which app?</span>
      <div class="combo"><input class="in lg" id="app" placeholder="e.g. Calendly, GitHub, Notion" value="${esc(S.app)}" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="sugg" data-in="app">
      ${S.app.trim().length>1 && !has && busy!=="find" && !S.docsEdit && S.docsSource!=="none" ? `<span class="go"><button class="btn blue" data-act="findDocs">Find docs <span class="arr">→</span></button></span>`:""}
      <div id="suggBox"></div></div>
    </label>
    ${docs}
    <div class="foot"><span class="small muted">${has?"Not the right page? Change it before you continue.":""}</span><div class="r"><button class="btn blue" data-act="discover" id="goApis" ${canGo?"":"disabled"}>Find the APIs <span class="arr">→</span></button></div></div>
  </div>`;
}
function suggestions(){
  const q = S.app.trim().toLowerCase(); const box = $("#suggBox"); if (!box) return;
  if (!q || suggHide || document.activeElement?.id!=="app"){ box.innerHTML=""; $("#app")?.setAttribute("aria-expanded","false"); return; }
  let list = KNOWN.filter(a=>a.name.toLowerCase().includes(q)).sort((a,b)=>a.name.toLowerCase().indexOf(q)-b.name.toLowerCase().indexOf(q)).slice(0,6);
  const exact = KNOWN.some(a=>a.name.toLowerCase()===q);
  const items = list.map(a=>`<button type="button" role="option" data-act="pickApp" data-name="${esc(a.name)}">${logo(a.name,a.domain)}<b>${esc(a.name)}</b><span class="d">Docs on file</span></button>`);
  if (!exact && q.length>1) items.push(`<button type="button" role="option" data-act="findDocs">${logo(S.app)}<span>Search for <b>${esc(S.app.trim())}</b> API docs</span><span class="d">AI search</span></button>`);
  suggIdx = Math.min(suggIdx, items.length-1);
  box.innerHTML = items.length ? `<div class="sugg" id="sugg" role="listbox">${items.map((h,i)=>i===suggIdx?h.replace('<button type="button"','<button type="button" class="hi"'):h).join("")}</div>` : "";
  $("#app")?.setAttribute("aria-expanded", items.length?"true":"false");
}
async function findDocs(){
  const name = S.app.trim(); if (name.length<2) return toast("Type the app's name first.");
  findErr = ""; suggHide = true; $("#suggBox") && ($("#suggBox").innerHTML="");
  const k = KNOWN.find(a=>a.name.toLowerCase()===name.toLowerCase());
  const refocus = () => setTimeout(()=>{ const el=$("#app"); if (el && S.step===1){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }, 30);
  if (k){
    set({app:k.name, domain:k.domain, docsUrl:k.docs, docsSource:"library", docsVerified:true, docsAlts:[], docsEdit:false, docsMode:"link", ...clearBelow()}); refocus();
    // In the background, check whether the vendor links to Postman docs; if so, prefer them.
    api("/api/find-docs", {app:k.name}, 20000).then(out=>{ if (out.source==="postman" && S.app===k.name && S.docsSource==="library" && !S.result && busy!=="disc"){ set({docsUrl:out.docsUrl, docsSource:"postman", docsLinkedBy:out.linkedBy, docsAlts:out.alternatives||[k.docs]}); refocus(); } }).catch(()=>{});
    return;
  }
  busy="find"; render();
  try{
    const out = await api("/api/find-docs", {app:name}, 30000);
    busy=null; refocus();
    if (out.docsUrl) set({app:out.app||name, domain:out.domain||"", docsUrl:out.docsUrl, docsSource:out.source==="postman"?"postman":"ai", docsLinkedBy:out.linkedBy||"", docsVerified:!!out.verified, docsAlts:(out.alternatives||[]).filter(u=>u!==out.docsUrl).slice(0,3), docsEdit:false, docsMode:"link", ...clearBelow()});
    else { findErr = `We couldn't find a public API reference for “${name}”. Paste the docs link or text below.`; set({docsSource:"none", docsEdit:true, docsUrl:"", ...clearBelow()}); }
  }catch(e){ busy=null; findErr = (e.message||"The search failed.")+" Paste the docs link instead."; set({docsSource:"none", docsEdit:true, ...clearBelow()}); }
}
const clearBelow = () => ({result:null, meta:null, files:null, safety:null, ep:null, reqs:{}, auth:null, staleFields:false});

/* step 2: fields */
function vFields(){
  return `<div class="narrow"><div class="head"><div class="row" style="margin-bottom:14px">${logo(S.app,S.domain,30)}<span class="label">${esc(S.app)}</span></div><h2>Which fields do you need?</h2><p>Type the fields from your requirement, the way you'd name them. Press Enter or a comma after each one.</p></div>
  <div class="panel">
    <div class="chipbox" data-act="focusChip">${S.fields.map((f,i)=>`<span class="chip">${esc(f)}<button data-act="rmField" data-i="${i}" aria-label="Remove ${esc(f)}">×</button></span>`).join("")}<input id="chipIn" placeholder="${S.fields.length?"Add another":"e.g. email, role, last_login"}" autocomplete="off" aria-label="Add a field"></div>
    <div class="quick"><span class="label" style="margin-right:4px">Common</span>${COMMON.filter(c=>!S.fields.includes(c)).map(c=>`<button class="qchip" data-act="addField" data-f="${c}">+ ${c}</button>`).join("")}</div>
    <div class="foot"><button class="btn line" data-act="go" data-s="1">← Back</button><div class="r"><button class="btn blue" data-act="discover" ${S.fields.length?"":"disabled"}>Find the APIs <span class="arr">→</span></button></div></div>
  </div></div>`;
}
function groups(eps){ const m=new Map(); for (const e of eps){ const k=e.module||""; if(!m.has(k)) m.set(k,[]); m.get(k).push(e); } return [...m.entries()]; }
function fieldsFor(){ if (S.fields.length) return S.fields; const out=[]; for (const e of (S.result?.endpoints||[])) for (const f of e.fields) if (!out.includes(f.field) && out.length<20) out.push(f.field); return out; }
function addFields(text){
  const add = String(text).split(/[,\n;]+/).map(s=>s.trim().replace(/\s+/g,"_")).filter(s=>s && s.length<=60);
  if (!add.length) return;
  const next = [...S.fields]; for (const f of add) if (!next.some(x=>x.toLowerCase()===f.toLowerCase()) && next.length<25) next.push(f);
  set({fields:next, staleFields: !!S.result});
}

/* step 3: APIs */
function vApis(){
  if (busy==="disc") return `<div class="narrow"><div class="head"><h2>Reading the ${esc(S.app)} docs…</h2><p>This usually takes 10 to 25 seconds.</p></div><div class="panel"><ul class="prog">${FIND_STEPS.map((t,i)=>`<li class="${i<prog?"done":i===prog?"cur":""}"><span class="ic">${i<prog?"✓":i===prog?'<span class="spin"></span>':"·"}</span>${t}</li>`).join("")}</ul><div class="foot"><button class="btn line sm" data-act="cancel">Cancel</button></div></div></div>`;
  if (!S.result) return `<div class="narrow"><div class="head"><h2>Find the APIs</h2></div><div class="panel">
      ${discErr?`<div class="note bad">${esc(discErr.message)}</div>`:`<p class="muted">${S.fields.length?`Fields: ${S.fields.map(f=>`<code>${esc(f)}</code>`).join(", ")}`:`Docs: <code>${esc(S.docsMode==="paste"?"pasted text":S.docsUrl)}</code>`}</p>`}
      ${discErr?.needPaste ? `<label class="field" style="margin-top:16px"><span class="label">Paste the API reference text</span><textarea class="in" id="docsText" data-in="docsText" placeholder="Paste the endpoint reference: paths, parameters, auth, example responses.">${esc(S.docsText)}</textarea></label>`:""}
      <div class="foot"><button class="btn line" data-act="go" data-s="1">← Back</button><div class="r"><button class="btn blue" data-act="discover">${discErr?"Try again":"Find the APIs"} <span class="arr">→</span></button></div></div></div></div>`;
  const R = S.result, eps = R.endpoints, fm = R.field_map;
  const got = fm.filter(f=>f.status==="found").length;
  const a = R.auth||{};
  const authLine = authPreview(a);
  return `<div class="head spread" style="align-items:flex-end"><div><div class="row" style="margin-bottom:14px">${logo(S.app,S.domain,30)}<span class="label">${esc(S.app)} · ${esc(srcLabel())}</span></div>
      <h2>${fm.length?`${eps.length} endpoint${eps.length===1?"":"s"} cover <em>${got} of ${fm.length}</em> fields`:`${eps.length} read endpoint${eps.length===1?"":"s"} <em>ready to test</em>`}</h2>
      <p>Base URL <code>${esc(R.base_url)}</code>. Open an endpoint to see its parameters and where each field sits in the response.</p></div>
      <div class="row"><button class="btn line sm" data-act="postman">Postman collection ↓</button></div></div>
    <div class="panel"><div class="spread"><span class="label">${fm.length?"Your fields":"Need specific fields? (optional)"}</span>${S.staleFields?`<button class="btn blue sm" data-act="discover">Search again <span class="arr">→</span></button>`:""}</div>
      <div class="chipbox" data-act="focusChip" style="margin-top:10px;min-height:50px;padding:7px 8px">${S.fields.map((f,i)=>`<span class="chip">${esc(f)}<button data-act="rmField" data-i="${i}" aria-label="Remove ${esc(f)}">×</button></span>`).join("")}<input id="chipIn" placeholder="${S.fields.length?"Add another field":"e.g. email, role, last_login, then Enter"}" autocomplete="off" aria-label="Add a field"></div>

async function discover(){
  busy="disc"; discErr=null; ctl = new AbortController(); S.step=3; save(); render();
  const job = api("/api/discover", {app:S.app, docsUrl:S.docsMode==="link"?S.docsUrl:"", docsText:S.docsMode==="paste"||(S.docsText||"").trim().length>=200?S.docsText:"", fields:S.fields}, 58000, ctl.signal);
  try{
    const out = await animateWhile(FIND_STEPS.length, job);
    busy=null;
    if (!out.result.endpoints.length){ discErr={message:`We read the docs but found no read-only endpoint${S.fields.length?` that returns ${S.fields.join(", ")}`:""}. Check the docs link, or paste the reference for the right section.`, needPaste:true}; return set({result:null}); }
    const R = out.result;
    R.endpoints = groups(R.endpoints).flatMap(([,l])=>l);
    set({result:R, meta:{source:out.source, pages:out.pages, model:out.model}, staleFields:false, ep:R.endpoints[0].id, reqs:{}, auth:initAuth(R.auth), files:null, safety:null});
  }catch(e){
    busy=null;
    if (e.name==="AbortError" && !ctl?.timedOut){ set({step: S.result ? 3 : 1}); return; }
    discErr = {message:e.message||"Couldn't read the docs.", needPaste:!!e.needPaste || e.status===422}; render();
  }
}
async function animateWhile(n, promise){
  prog = 0; render(); let done=false; promise.finally(()=>done=true).catch(()=>{});
  while (!done && prog < n-1){ await sleep(2200+Math.random()*1800); if (!done){ prog++; if (busy) render(); } }
  return promise;
}

function fieldCheck(e, json){
  if (json===undefined || json===null || typeof json!=="object") return null;
  const norm = s => String(s).toLowerCase().replace(/[^a-z0-9]/g,"");
  const found = new Map();
  (function walk(v, path, depth){
    if (depth>8 || found.size>400) return;
    if (Array.isArray(v)){ if (v.length) walk(v[0], path+"[0]", depth+1); return; }
    if (v && typeof v==="object") for (const [k,x] of Object.entries(v)){ const p = path?`${path}.${k}`:k; const n = norm(k); if (!found.has(n)) found.set(n, {path:p, v:x}); walk(x, p, depth+1); }

  return fm.map(f=>{
    const tail = String(f.json_path||"").split(/[.\[\]]+/).filter(Boolean).pop();
    const hit = found.get(norm(f.field)) || (tail && found.get(norm(tail)));
    const other = f.endpoint && f.endpoint!==e.id ? S.result.endpoints.find(x=>x.id===f.endpoint)?.path : "";

    let sample = typeof hit.v==="object" && hit.v!==null ? (Array.isArray(hit.v)?`[${hit.v.length} items]`:"{…}") : JSON.stringify(hit.v);
    if (sample && sample.length>60) sample = sample.slice(0,57)+"…";

  });
}

    : a.type==="basic" ? {type:"basic", basic:[{key:"username", value:"{{username}}", type:"string"},{key:"password", value:"{{apiKey}}", type:"string"}]}

  const item = R.endpoints.map(e=>{ const r = req(e.id);

    return {name:`${e.summary||e.path}`.slice(0,80), request:{method:"GET", header:[...a.extra.filter(x=>x.on).map(x=>({key:x.key, value:x.value})), ...r.headers.filter(h=>h.on&&h.key).map(h=>({key:h.key, value:h.value}))],
      url:{raw:`{{baseUrl}}/${path.join("/")}${qs?"?"+qs:""}`, host:["{{baseUrl}}"], path, ...(query.length?{query}:{}), ...(variable.length?{variable}:{})}, description:`${e.summary}\n\nFields: ${e.fields.map(f=>f.field+" ← "+(f.json_path||"")).join(", ")}${e.docs_url?`\nDocs: ${e.docs_url}`:""}`}};
  });
  const col = {info:{name:`${S.app} API (Fetch)`, description:`Read-only requests for: ${fieldsFor().join(", ")}. Made with Fetch. Set apiKey in the collection variables (use a trial key).`, schema:"https://schema.getpostman.com/json/collection/v2.1.0/collection.json"},
    auth, variable:[{key:"baseUrl", value:(R.base_url||"").replace(/\/+$/,"")},{key:"apiKey", value:"", type:"secret"}, ...(a.type==="basic"?[{key:"username", value:""}]:[])], item};
  saveBlob(new Blob([JSON.stringify(col, null, 2)], {type:"application/json"}), `${slug()}.postman_collection.json`);
  toast("Postman collection downloaded. In Postman: Import, then set apiKey in the collection's Variables.");
}

function safetyChecks(files){

  const find = (re, allow) => src.flatMap(([n,s]) => String(s).split("\n").map((l,i)=>re.test(l) && !(allow&&allow(n,l)) ? `${n}:${i+1}` : null).filter(Boolean));

  rows.push({label:"Read-only: no create, update or delete", pass:!writes.length, detail:writes.slice(0,3).join(", ")});
  const hosts = src.flatMap(([n,s]) => [...String(s).matchAll(/https?:\/\/([A-Za-z0-9.\-]+)/g)].map(m=>m[1]).filter(h=>!(h===root||h.endsWith("."+root)||h==="localhost"||h==="127.0.0.1"||/example\.(com|org)$/.test(h))).map(h=>`${n}: ${h}`));

  const sec = find(/(Bearer\s+[A-Za-z0-9\-_.]{20,}|eyJ[A-Za-z0-9_\-]{20,}\.|(api[_-]?key|secret|password|token)\s*[:=]\s*["'][A-Za-z0-9_\-]{16,}["'])/i);
  rows.push({label:"No keys or secrets in the code", pass:!sec.length, detail:sec.slice(0,3).join(", ")});
  const dang = find(/(\beval\s*\(|\bexec\s*\(|import\s+(subprocess|pickle|socket|ctypes)|os\.system\(|child_process|Runtime\.getRuntime|"os\/exec"|new Function\()/);
  rows.push({label:"No dangerous calls", pass:!dang.length, detail:dang.slice(0,3).join(", ")});
  const all = src.map(([,s])=>s).join("\n");
  rows.push({label:"Logs mask tokens and emails", pass:/REDACTED|redact|mask/i.test(all), detail:/REDACTED|redact|mask/i.test(all)?"":"no masking found"});

  rows.push({label:"Maps every field you asked for", pass:!fieldsOk.length, detail:fieldsOk.slice(0,4).join(", ")});
  return rows;
}

async function api(path, body, ms=58000, signal){
  const own = new AbortController(); let timedOut = false;
  const timer = setTimeout(()=>{ timedOut = true; own.abort(); if (ctl) ctl.timedOut = true; }, ms);
  if (signal) signal.addEventListener("abort", ()=>own.abort(), {once:true});
  let r;
  try { r = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body), signal:own.signal}); }
  catch(e){ if (timedOut) throw Object.assign(new Error("It took too long to answer. Try again."), {status:504}); if (e.name==="AbortError") throw e; throw new Error("Couldn't reach Fetch's server. Check your connection."); }
  finally { clearTimeout(timer); }
  const data = await r.json().catch(()=>({error: r.status===504 ? "It took too long to answer. Try again." : "The server returned an unreadable answer."}));
  if (!r.ok) throw Object.assign(new Error(data.error || "Request failed"), {status:r.status, needPaste:!!data.needPaste});
  return data;
}

  if ("pv" in t.dataset){ const p=r.params[+t.dataset.pv]; p.value=t.value; if (p.in==="query" && t.value) { p.on=true; const c=$(`[data-pchk="${t.dataset.pv}"]`); if (c) c.checked=true; } save(); syncUrl(); return; }
  if ("pk" in t.dataset){ r.params[+t.dataset.pk].key=t.value; save(); syncUrl(); return; }
  if ("hk" in t.dataset){ r.headers[+t.dataset.hk].key=t.value; save(); return; }
  if ("hv" in t.dataset){ r.headers[+t.dataset.hv].value=t.value; save(); return; }
  if ("xv" in t.dataset){ S.auth.extra[+t.dataset.xv].value=t.value; save(); return; }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.dataset.auth==="type"){ S.auth.type=t.value; save(); render(); return; }
  if (t.id==="reqUrl"){ const e=curEp(); parseUrlInto(t.value, e, req(e.id)); const pane=$(".work .pane"); if (pane && S.reqTab==="params") pane.innerHTML = paramsPane(req(e.id)); return; }
  const r = S.step===4 ? req(S.ep) : null; if (!r) return;
  if ("pchk" in t.dataset){ r.params[+t.dataset.pchk].on=t.checked; save(); syncUrl(); }
  if ("hchk" in t.dataset){ r.headers[+t.dataset.hchk].on=t.checked; save(); }
  if ("xchk" in t.dataset){ S.auth.extra[+t.dataset.xchk].on=t.checked; save(); }
});
document.addEventListener("keydown", ev => {
  const t = ev.target;
  if (t.id==="app"){
    const items = [...document.querySelectorAll("#sugg button")];
    if (ev.key==="ArrowDown" && items.length){ ev.preventDefault(); suggIdx=(suggIdx+1)%items.length; suggestions(); }
    else if (ev.key==="ArrowUp" && items.length){ ev.preventDefault(); suggIdx=(suggIdx-1+items.length)%items.length; suggestions(); }
    else if (ev.key==="Enter"){ ev.preventDefault(); if (suggIdx>=0 && items[suggIdx]) items[suggIdx].click(); else if (reach()>=3) discover(); else findDocs(); }
    else if (ev.key==="Escape"){ $("#suggBox").innerHTML=""; }
  }
  if (t.id==="chipIn"){
    if (ev.key==="Enter"){ ev.preventDefault(); if (t.value.trim()){ const v=t.value; t.value=""; addFields(v); $("#chipIn")?.focus(); } else if (S.fields.length) discover(); }
    else if (ev.key==="Backspace" && !t.value && S.fields.length){ set({fields:S.fields.slice(0,-1), staleFields:!!S.result}); $("#chipIn")?.focus(); }
  }
  if (t.id==="docsUrl" && ev.key==="Enter" && reach()>=3){ ev.preventDefault(); S.docsEdit=false; discover(); }
  if ((t.id==="reqUrl" || t.closest?.(".grid") || t.id==="kTok") && ev.key==="Enter"){ ev.preventDefault(); if (t.id==="kTok"){ if (hasKey()) set({view:"req"}); } else { if (t.id==="reqUrl") { const e=curEp(); parseUrlInto(t.value, e, req(e.id)); } send(); } }
  if ((ev.metaKey||ev.ctrlKey) && ev.key==="Enter" && S.step===4){ ev.preventDefault(); send(); }
});
document.addEventListener("focusin", ev => { if (ev.target.id==="app") suggestions(); });
document.addEventListener("focusout", ev => { if (ev.target.id==="app") setTimeout(()=>{ if (document.activeElement?.id==="app" || document.activeElement?.closest?.("#suggBox")) return; const b=$("#suggBox"); if (b) b.innerHTML=""; }, 150); });
window.addEventListener("beforeunload", () => { KEY.token=KEY.user=KEY.pass=""; });

fetch("/api/status").then(r=>r.json()).then(s=>{ AI = !!s.ai; if (!AI) $("#banner").innerHTML = `<div class="banner">AI isn't configured on this server yet, so docs search, API finding and code generation are off.</div>`; }).catch(()=>{});
if (S.auth == null && S.result) S.auth = initAuth(S.result.auth);
render();
</script>
</body>
</html>
